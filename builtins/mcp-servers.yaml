# MCP Server Registry
# Barry's own MCP server. Remote/external servers are now in ~/.barry/packs.yaml.

servers:
  barry:
    path: servers/mcp
    dist_entry: dist/bundle.cjs
    port: 3901
    env:
      - BARRY_SECRET
      - BARRY_DATABASE_URL
      - SENTRY_DSN
      - AXIOM_TOKEN
      # Sender identity for the resend pack (config, not a secret — the Resend
      # API key itself is a per-profile secret). Without this the pack throws at
      # import and its tools are absent from every session.
      - BARRY_EMAIL_ADDRESS
