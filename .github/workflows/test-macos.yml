name: macos

# Swift apps and BarryKit. Not part of the pnpm workspace, so this lane is
# entirely independent of the Node build.
on:
  push:
    branches: [master]
    paths: &paths
      - "apps/macos/**"
      - ".swiftlint.yml"
      - ".github/workflows/test-macos.yml"
  pull_request:
    paths: *paths
  workflow_dispatch:

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # One job per package rather than four sequential steps. They shared nothing
  # but the runner, and each was paying ~2 minutes to resolve and build the same
  # SPM dependency graph. macOS runners are the scarcest, so the wall-clock win
  # is worth the extra concurrency.
  test:
    runs-on: macos-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: BarryKit
          - package: BarrySessions
          - package: BarryProfiles
          # BDiff's executable target uses Bundle.module (internal in SwiftPM
          # for executable targets), which fails to compile under `swift test`.
          # Tests only cover BDiffCore, so filter to skip building the app.
          - package: BDiff
            filter: --filter BDiffTests
    name: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v5
      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: |
            apps/macos/${{ matrix.package }}/.build
            ~/Library/Caches/org.swift.swiftpm
          # Package.resolved pins the graph, so it is the right cache key. The
          # source-hash suffix keeps incremental build products fresh without
          # forcing a cold resolve when only sources change.
          key: spm-${{ matrix.package }}-${{ hashFiles(format('apps/macos/{0}/Package.resolved', matrix.package)) }}-${{ hashFiles(format('apps/macos/{0}/Sources/**/*.swift', matrix.package)) }}
          restore-keys: |
            spm-${{ matrix.package }}-${{ hashFiles(format('apps/macos/{0}/Package.resolved', matrix.package)) }}-
            spm-${{ matrix.package }}-
      - name: Test ${{ matrix.package }}
        run: swift test --package-path apps/macos/${{ matrix.package }} ${{ matrix.filter }}
