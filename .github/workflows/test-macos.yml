name: macos

# Swift apps and BarryKit. Not part of the pnpm workspace, so this lane is
# entirely independent of the Node build.
on:
  push:
    branches: [master]
    paths: &paths
      - "packages/BarryKit/**"
      # One line per app, and they must stay in step with the `path` values in
      # the matrix below. A glob does not work here: `bags/*/app/**` is one
      # level too shallow for sessions-macos/app, and neither identities-app
      # nor actions-app is named `app` at all. An app missing from this list
      # triggers nothing on change, and the lane still reports green because
      # it simply never ran — the failure this list already had once.
      - "bags/sessions/sessions-macos/app/**"
      - "bags/identities/identities-app/**"
      - "bags/actions/actions-app/**"
      - ".swiftlint.yml"
      - ".github/workflows/test-macos.yml"
  pull_request:
    paths: *paths
  workflow_dispatch:

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # One job per package rather than four sequential steps. They shared nothing
  # but the runner, and each was paying ~2 minutes to resolve and build the same
  # SPM dependency graph. macOS runners are the scarcest, so the wall-clock win
  # is worth the extra concurrency.
  test:
    runs-on: macos-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: BarryKit
            path: packages/BarryKit
          - package: BarrySessions
            path: bags/sessions/sessions-macos/app
          # Depends on the sessions package for IdentitiesFeature, so this also
          # proves that export still resolves from outside its own package —
          # the thing that broke when both directories were called `app`.
          - package: BarryIdentities
            path: bags/identities/identities-app
          # Same shape as BarryIdentities: depends on the sessions package, here
          # for Components' markdown theme rather than a whole feature.
          - package: BarryActions
            path: bags/actions/actions-app
    name: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v5
      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: |
            ${{ matrix.path }}/.build
            ~/Library/Caches/org.swift.swiftpm
          # Package.resolved pins the graph, so it is the right cache key. The
          # source-hash suffix keeps incremental build products fresh without
          # forcing a cold resolve when only sources change.
          key: spm-${{ matrix.package }}-${{ hashFiles(format('{0}/Package.resolved', matrix.path)) }}-${{ hashFiles(format('{0}/Sources/**/*.swift', matrix.path)) }}
          restore-keys: |
            spm-${{ matrix.package }}-${{ hashFiles(format('{0}/Package.resolved', matrix.path)) }}-
            spm-${{ matrix.package }}-
      - name: Test ${{ matrix.package }}
        run: swift test --package-path ${{ matrix.path }}
