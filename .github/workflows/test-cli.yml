name: cli

# The CLI owns the integration suite: test:ci:integration is `pnpm --dir cli
# test`, and those specs talk to a real database.
on:
  push:
    branches: [master]
    paths: &paths
      - "cli/**"
      # Every workspace package, not a hand-picked few. The CLI imports far more
      # than packages/db (agent-runtime, session-client, bags, tools, env ...),
      # and an explicit dependency list here fails SILENTLY when it falls
      # behind: the lane simply does not run and CI is green. A broad trigger
      # costs some redundant runs and cannot go quietly stale.
      - "packages/**"
      # Shared test infrastructure: the config every suite inherits, the runner
      # that discovers which tests exist, and the workspace inventory it walks.
      # Without these a change to test DISCOVERY triggers no test lane at all.
      - "vitest.base.config.ts"
      - "scripts/ci/**"
      - "workspace-entries.json"
      - ".github/workflows/test-cli.yml"
      - ".github/workflows/_postgres-tests.yml"
      - "pnpm-lock.yaml"
  pull_request:
    paths: *paths
  workflow_dispatch:

concurrency:
  group: cli-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration-tests:
    uses: ./.github/workflows/_postgres-tests.yml
    with:
      command: pnpm test:ci:integration
      label: Run CLI integration tests
