name: Shared test runner

# Shared runner for the lanes that call it. It used to provision a database
# service container and run migrations before the command -- the unit tier
# needed one because packages/db's schema-drift guard compared types.ts against
# a migrated database, and the CLI suite migrated and seeded a test database in
# its globalSetup. The database server is gone and both of those are deleted;
# what remains is the setup the lanes still share.
on:
  workflow_call:
    inputs:
      command:
        description: Command to run
        required: true
        type: string
      label:
        description: Human-readable step name
        required: true
        type: string

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # bags/artifacts' pretest compares its dependency versions against the
      # artifacts-viewer consumer, which lives outside this repo. The guard
      # refuses to infer anything from a missing file: it exits 2 unless the
      # absence is declared, because passing silently is what let an earlier
      # version of it sit inert. A runner cannot have that checkout, so the
      # declaration belongs here. On a machine that DOES have it, the guard
      # still runs and still reports drift.
      BARRY_ALLOW_MISSING_CONSUMER: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      # Two host binaries the suites shell out to, neither shipped by
      # ubuntu-latest:
      #
      # ripgrep — bags/filesystem's Grep and Glob tools. Without it those tests
      # failed with `spawnSync rg ENOENT` instead of exercising the real paths.
      #
      # sqlite3 — `barry db backup` verifies its copy with `pragma
      # integrity_check`, and deliberately refuses to treat an ABSENT sqlite3 as
      # a passing check. So without the binary the command throws on every
      # backup, and cli/test/error-output.test.ts timed out waiting for output
      # it could never produce. Installing it is the fix; loosening that guard
      # would be the check-that-cannot-fail this repo keeps warning about.
      - name: Install ripgrep and sqlite3
        run: sudo apt-get update && sudo apt-get install -y ripgrep sqlite3
      - name: ${{ inputs.label }}
        run: ${{ inputs.command }}
