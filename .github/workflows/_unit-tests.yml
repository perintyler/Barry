name: Shared test runner

# Shared setup for release-mirror test lanes; private-repository Actions remain disabled.
permissions:
  contents: read

on:
  workflow_call:
    inputs:
      command:
        description: Command to run
        required: true
        type: string
      label:
        description: Human-readable step name
        required: true
        type: string

jobs:
  test:
    if: github.repository != 'perintyler/barry-dev' && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: ./.github/actions/setup
      # Two host binaries the suites shell out to, neither shipped by
      # ubuntu-latest:
      #
      # ripgrep — bags/filesystem's Grep and Glob tools. Without it those tests
      # failed with `spawnSync rg ENOENT` instead of exercising the real paths.
      #
      # sqlite3 — `barry db backup` verifies its copy with `pragma
      # integrity_check`, and deliberately refuses to treat an ABSENT sqlite3 as
      # a passing check. So without the binary the command throws on every
      # backup, and cli/test/error-output.test.ts timed out waiting for output
      # it could never produce. Installing it is the fix; loosening that guard
      # would be the check-that-cannot-fail this repo keeps warning about.
      #
      # lsof — the vault restore refuses to swap database files while another
      # process holds them open, and asks lsof which ones do. Without it the
      # restore cannot establish that, and refuses every time.
      - name: Install ripgrep, sqlite3 and lsof
        run: sudo apt-get update && sudo apt-get install -y ripgrep sqlite3 lsof
      - name: ${{ inputs.label }}
        run: ${{ inputs.command }}
