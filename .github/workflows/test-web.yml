name: web

# Browser-facing apps. Triggers on the shared packages they build against, so a
# change to packages/ui or the API contract still exercises the web unit tests.
on:
  push:
    branches: [master]
    paths: &paths
      - "apps/web/**"
      - "packages/ui/**"
      - "packages/db/**"
      - "packages/contracts/**"
      - ".github/workflows/test-web.yml"
      - ".github/workflows/_postgres-tests.yml"
      - "pnpm-lock.yaml"
  pull_request:
    paths: *paths
  workflow_dispatch:

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    uses: ./.github/workflows/_postgres-tests.yml
    with:
      command: node scripts/ci/run-unit-tests.mjs --scope=apps/web
      label: Run web unit tests


