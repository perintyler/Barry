name: verify

# Repo-wide correctness gates: workspace inventory, generated-code drift,
# unused code, dependency/license/secret audits, and the build graph. Like
# lint, none of it is area-scoped, so it runs once per change.
on:
  push:
    branches: [master]
    paths-ignore: &docs
      # A run is skipped only when *every* changed file matches, so a commit
      # mixing docs with code still gets linted. Pure prose cannot fail eslint,
      # the audits, or the policy check.
      - "**/*.md"
      - "docs/**"
      - "LICENSE.md"
  pull_request:
    paths-ignore: *docs
  workflow_dispatch:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audits:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - name: Install OSV Scanner
        run: scripts/ci/install-osv-scanner
      - name: Audit dependencies
        run: pnpm security:dependencies
      - name: Audit licenses
        run: pnpm security:licenses
      - name: Audit secrets
        run: pnpm security:secrets

  static:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - name: Verify no stale path references
        run: pnpm check:stale-paths
      - name: Verify monorepo policy
        run: pnpm check:monorepo
      - name: Verify generated contracts
        run: pnpm contracts:check
      - name: Verify no stranded `barrys` entity names
        run: pnpm check:identity-residue
      # The Scope->Bound rename fails open: an unresolvable name is treated as
      # "no restrictions", so a stranded identifier can mean a session that
      # looks restricted and is not. The guard existed but nothing ran it —
      # knip caught it as an unused file.
      - name: Verify no stranded `Scope` identifiers
        run: pnpm check:bound-vocabulary
      - name: Verify documentation links
        run: pnpm check:doc-links
      # Belongs here rather than in a test lane: the thing it guards is whether
      # the test lanes RUN AT ALL, so a lane cannot be trusted to police its own
      # trigger. verify.yml runs on every push, which is the only placement that
      # catches a lane made unable to fire.
      - name: Verify test lanes trigger on shared infrastructure
        run: pnpm check:workflow-triggers
      - name: Verify Brewfile entries against actual usage
        run: pnpm check:brewfile
      - name: Check for unused code
        run: pnpm knip
      # `pnpm -r typecheck` rather than the root `typecheck` script: that script
      # is `pnpm -r typecheck && pnpm run build:projects`, and the project graph
      # is already built by the next step.
      - name: Typecheck every package
        run: pnpm -r typecheck
      - name: Build project graph
        run: pnpm build:projects
      - name: Build apps
        run: pnpm build:apps
