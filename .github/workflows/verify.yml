name: verify

# Repo-wide correctness gates: workspace inventory, generated-code drift,
# unused code, dependency/license/secret audits, and the build graph. Like
# lint, none of it is area-scoped, so it runs once per change.
permissions:
  contents: read

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    if: github.repository != 'perintyler/barry-dev' && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: ./.github/actions/setup
      - name: Install OSV Scanner
        run: node .github/ci/run.mjs install:osv
      # Dependency direction is documented in bags/README.md and checked locally.
      - name: Run the complete local static gate
        run: pnpm ci:verify:static
      - name: Typecheck every workspace
        run: pnpm -r typecheck
