name: verify

# Repo-wide correctness gates: workspace inventory, generated-code drift,
# unused code, dependency/license/secret audits, and the build graph. Like
# lint, none of it is area-scoped, so it runs once per change.
on:
  push:
    branches: [master]
    paths-ignore: &docs
      # A run is skipped only when *every* changed file matches, so a commit
      # mixing docs with code still gets linted. Pure prose cannot fail eslint,
      # the audits, or the policy check.
      - "**/*.md"
      - "docs/**"
      - "LICENSE.md"
  pull_request:
    paths-ignore: *docs
  workflow_dispatch:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audits:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - name: Install OSV Scanner
        run: scripts/ci/install-osv-scanner
      - name: Audit dependencies
        run: pnpm security:dependencies
      - name: Audit licenses
        run: pnpm security:licenses
      - name: Audit secrets
        run: pnpm security:secrets

  static:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - name: Verify monorepo policy
        run: pnpm check:monorepo
      - name: Verify generated contracts
        run: pnpm contracts:check
      - name: Check for unused code
        run: pnpm knip
      - name: Build project graph
        run: pnpm build:projects
      - name: Build apps
        run: pnpm build:apps
