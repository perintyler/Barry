name: bags

on:
  push:
    branches: [master]
    paths: &paths
      - "bags/**"
      # The builtin registry seeds. These lived at `config/*.builtin.yaml` until
      # 43ed1d0b dissolved config/ and moved them here — after which this lane's
      # trigger matched nothing, so the bags lane went deaf to exactly the
      # registry changes it was written to watch. It stayed hidden because three
      # other lanes trigger on `packages/db/**` and kept running, so coverage
      # looked fine in aggregate.
      - "packages/db/seed/**"
      # Shared test infrastructure: the config every suite inherits, the runner
      # that discovers which tests exist, and the workspace inventory it walks.
      # Without these a change to test DISCOVERY triggers no test lane at all.
      - "vitest.base.config.ts"
      - "scripts/ci/**"
      - "workspace-entries.json"
      - ".github/workflows/test-bags.yml"
      - ".github/workflows/_postgres-tests.yml"
      - "pnpm-lock.yaml"
  pull_request:
    paths: *paths
  workflow_dispatch:

concurrency:
  group: bags-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    uses: ./.github/workflows/_postgres-tests.yml
    with:
      command: node scripts/ci/run-unit-tests.mjs --scope=bags
      label: Run bag unit tests
