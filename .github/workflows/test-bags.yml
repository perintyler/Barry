name: bags

on:
  push:
    branches: [master]
    paths: &paths
      # Also covers what Barry ships: the builtin bags are discovered from this
      # tree, and the traits, bounds and remote registrations live in its root
      # bag.yaml. They used to be separate seed files that moved three times
      # (config/ -> packages/db/seed/ -> sdk/cli/seed/), and each move broke a
      # trigger here silently: the lane went deaf to exactly the changes it was
      # written to watch, and other lanes kept running, so coverage looked fine
      # in aggregate. Moving this directory must move this path with it.
      - "builtin/**"
      # Shared test infrastructure: the config every suite inherits, the runner
      # that discovers which tests exist, and the workspace inventory it walks.
      # Without these a change to test DISCOVERY triggers no test lane at all.
      - "vitest.base.config.ts"
      - ".github/ci/**"
      - ".github/actions/setup/action.yml"
      - "package.json"
      - "workspace-entries.json"
      - ".github/workflows/test-bags.yml"
      - ".github/workflows/_unit-tests.yml"
      - "pnpm-lock.yaml"
  pull_request:
    paths: *paths
  workflow_dispatch:

concurrency:
  group: bags-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    uses: ./.github/workflows/_unit-tests.yml
    with:
      command: node .github/ci/run.mjs test:ci:unit --scope=builtin
      label: Run bag unit tests
