name: packages

# Shared libraries. Their unit tier needs Postgres because packages/db checks
# its generated types against a migrated database.
on:
  push:
    branches: [master]
    paths: &paths
      - "packages/**"
      # `sdks/**` and `hooks/**` used to be here and were dropped: sdks/ was
      # absorbed into bags/artifacts and hooks/ retired once every hook came
      # from a bag, so both globs had stopped matching anything. A trigger that
      # cannot fire is indistinguishable from one that simply never had reason
      # to, which is why the policy check now asserts each one still resolves.
      # Shared test infrastructure: the config every suite inherits, the runner
      # that discovers which tests exist, and the workspace inventory it walks.
      # Without these a change to test DISCOVERY triggers no test lane at all.
      - "vitest.base.config.ts"
      - "scripts/ci/**"
      - "workspace-entries.json"
      - ".github/workflows/test-packages.yml"
      - ".github/workflows/_postgres-tests.yml"
      - "pnpm-lock.yaml"
  pull_request:
    paths: *paths
  workflow_dispatch:

concurrency:
  group: packages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    uses: ./.github/workflows/_postgres-tests.yml
    with:
      command: node scripts/ci/run-unit-tests.mjs --scope=packages,sdks,hooks
      label: Run unit-tier tests
