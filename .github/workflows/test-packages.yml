name: packages

# Shared libraries.
on:
  push:
    branches: [master]
    paths: &paths
      # `packages/` is gone — ecfd08d8 dissolved it, moving the bag host to
      # sdk/bag-host. The path glob and the `packages` scope both outlived it,
      # and a scope matching no workspace is the dead-scope bug described just
      # below, recurring: check:workflow-triggers caught it this time.
      # sdk/, NOT `sdks/`. The `sdks/**` and `hooks/**` globs that used to sit
      # here were dropped as dead, but the scope argument below kept naming
      # them, and `sdks` matches no workspace, so every sdk/* package ran
      # nowhere. Measured 2026-09-22 with a deliberately failing test in
      # sdk/auth: the lane reported "12 workspace unit suites passed", exit 0.
      # check:workflow-triggers now asserts every scope selects a workspace.
      - "sdk/**"
      # engine/ carries `engine` itself and engine/secrets, a sibling workspace
      # package under it. Neither was in any lane: --scope matches workspace
      # PATH prefixes, and no lane named `engine`, so both ran nowhere.
      # workflow-test-triggers only asserts a declared scope selects something,
      # not that every workspace with tests is selected by some lane -- so the
      # gap was silent. Covered here because these are shared libraries by the
      # same argument as packages/ and sdk/.
      - "sdk/engine/**"
      # Shared test infrastructure: the config every suite inherits, the runner
      # that discovers which tests exist, and the workspace inventory it walks.
      # Without these a change to test DISCOVERY triggers no test lane at all.
      - "vitest.base.config.ts"
      - ".github/ci/**"
      - ".github/actions/setup/action.yml"
      - "package.json"
      - "workspace-entries.json"
      - ".github/workflows/test-packages.yml"
      - ".github/workflows/_unit-tests.yml"
      - "pnpm-lock.yaml"
  pull_request:
    paths: *paths
  workflow_dispatch:

concurrency:
  group: packages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    uses: ./.github/workflows/_unit-tests.yml
    with:
      command: node .github/ci/run.mjs test:ci:unit --scope=sdk
      label: Run unit-tier tests
