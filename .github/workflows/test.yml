name: Workspace tests
permissions:
  contents: read
on:
  push:
    branches: [master]
    paths:
      - "sdk/**"
      - "cli/**"
      - "bags/**"
      - "adapters/**"
      - "vitest.base.config.ts"
      - "vitest.instance-home.setup.ts"
      - "eslint.config.js"
      - ".github/ci/**"
      - ".github/actions/setup/action.yml"
      - ".github/workflows/test.yml"
      - ".github/workflows/_unit-tests.yml"
      - "package.json"
      - "workspace-entries.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "vitest.config.ts"
      - "tsconfig*.json"
  pull_request:
  workflow_dispatch:
concurrency:
  group: workspace-tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  workspace:
    if: github.repository != 'perintyler/barry-dev' && github.event.repository.private == false
    strategy:
      fail-fast: false
      matrix:
        scope: ["sdk,cli", "bags", "adapters"]
    uses: ./.github/workflows/_unit-tests.yml
    with:
      command: node .github/ci/run.mjs test:ci:unit --scope=${{ matrix.scope }}
      label: Run workspace unit tests
