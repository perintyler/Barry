name: Postgres-backed tests

# Shared runner for the two lanes that need a live database: the unit tier
# (packages/db's schema-drift guard compares types.ts against a migrated
# database) and the CLI integration suite.
on:
  workflow_call:
    inputs:
      command:
        description: pnpm script to run after migrations
        required: true
        type: string
      label:
        description: Human-readable step name
        required: true
        type: string

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: barry
          POSTGRES_PASSWORD: barry
          POSTGRES_DB: barry_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U barry -d barry_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      BARRY_DATABASE_HOST: 127.0.0.1
      BARRY_DATABASE_USER: barry
      BARRY_DATABASE_PASSWORD: barry
      BARRY_DATABASE_NAME: barry_test
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - name: Run DB migrations
        run: pnpm --dir packages/db migrate
      - name: ${{ inputs.label }}
        run: ${{ inputs.command }}
