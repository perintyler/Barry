# CI for the published copy of Barry (the filtered repo that `barry release
# sync` pushes to the staging and prod targets). Maintained here in the private
# repo and swapped in as .github/workflows/ci.yml during every sync — see the
# `sync.overlays` section of config/releases.yaml.
#
# The private .github/workflows/ci.yml does NOT ship: it exercises private apps
# (apps/web/barry.works web smoke, Postgres-backed cli integration tests) that are
# stubbed out of the published tree. This workflow only runs what exists there:
# install, lint, monorepo policy, project builds, and public-package unit tests.
name: CI

on:
  push:
    branches:
      - master
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-static:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - name: Install OSV Scanner
        run: scripts/ci/install-osv-scanner
      - name: Lint
        run: pnpm lint:eslint:ci
        env:
          NODE_OPTIONS: --max-old-space-size=4096
      - name: Audit dependencies
        run: pnpm security:dependencies
      - name: Audit licenses and secrets
        run: pnpm security:licenses && pnpm security:secrets
      - name: Verify monorepo policy
        run: pnpm check:monorepo
      - name: Build projects
        run: pnpm build:projects

  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: verify-static
    # packages/db's schema-drift guard compares types.ts against a live,
    # migrated database — the unit lane needs Postgres too.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: barry
          POSTGRES_PASSWORD: barry
          POSTGRES_DB: barry_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U barry -d barry_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      BARRY_DATABASE_HOST: 127.0.0.1
      BARRY_DATABASE_USER: barry
      BARRY_DATABASE_PASSWORD: barry
      BARRY_DATABASE_NAME: barry_test
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - name: Run DB migrations
        run: pnpm --dir packages/db migrate
      - name: Run unit-tier tests
        run: pnpm test:ci:targeted

  macos-lint:
    runs-on: macos-latest
    timeout-minutes: 10
    needs: verify-static
    steps:
      - uses: actions/checkout@v5
      - name: Install SwiftLint
        run: scripts/ci/install-swiftlint
      - name: Lint Swift
        run: swiftlint lint --config .swiftlint.yml
