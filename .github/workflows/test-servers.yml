name: servers

on:
  push:
    branches: [master]
    paths: &paths
      - "servers/**"
      # Every workspace package, replacing a hand-picked `packages/db` +
      # `packages/contracts`. The API depends on far more than those two —
      # agent-runtime and session-client among them — and an explicit list here
      # fails SILENTLY as it falls behind: the lane does not run, and CI is
      # green because nothing tested it. A broad trigger costs redundant runs
      # and cannot go quietly stale.
      - "packages/**"
      # Shared test infrastructure. This lane runs
      # `node scripts/ci/run-unit-tests.mjs --scope=servers` and did not trigger
      # on `scripts/ci/**`, so editing the runner that DISCOVERS the tests ran
      # no tests at all — the check could not fail.
      - "vitest.base.config.ts"
      - "scripts/ci/**"
      - "workspace-entries.json"
      - ".github/workflows/test-servers.yml"
      - ".github/workflows/_postgres-tests.yml"
      - "pnpm-lock.yaml"
  pull_request:
    paths: *paths
  workflow_dispatch:

concurrency:
  group: servers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    uses: ./.github/workflows/_postgres-tests.yml
    with:
      command: node scripts/ci/run-unit-tests.mjs --scope=servers
      label: Run server unit tests
