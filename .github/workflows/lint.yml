name: lint

# Repo-wide static analysis. None of this is scoped to an area — eslint walks
# the whole tree, the audits cover every dependency, and the policy check
# validates the whole workspace inventory — so it runs once per change rather
# than once per area lane.
on:
  push:
    branches: [master]
    paths-ignore: &docs
      # A run is skipped only when *every* changed file matches, so a commit
      # mixing docs with code still gets linted. Pure prose cannot fail eslint,
      # the audits, or the policy check.
      - "**/*.md"
      - "docs/**"
      - "LICENSE.md"
  pull_request:
    paths-ignore: *docs
  workflow_dispatch:

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eslint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - name: Lint
        # Type-aware linting holds a TS program for the whole repo in memory
        # (~1.3 GB peak), which exceeds Node's default ~2 GB heap on the runner.
        # The runner has 16 GB RAM so 6 GB is comfortable headroom.
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: pnpm lint:eslint:ci

# No `swiftlint` job. There is no Swift in this repo any more — BarryKit and
# the four macOS apps are their own repositories, and each lints and tests
# itself there. The job would have kept running on a macOS runner (the
# scarcest kind) to lint nothing, and `swiftlint lint` over an empty set exits
# 0, so it would have reported green forever.
