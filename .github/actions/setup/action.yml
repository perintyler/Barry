name: Setup
description: Check out deps toolchain — pnpm (from package.json's packageManager), Node (from .node-version), install with a frozen lockfile, and build the packages others import from dist/.

runs:
  using: composite
  steps:
    # No `version:` here. package.json's `packageManager` names the pnpm
    # version, and action-setup refuses to start when both are set and differ;
    # a second pin is how CI broke when packageManager moved to pnpm 12.
    - name: Setup pnpm
      uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

    - name: Setup Node
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
      with:
        node-version-file: .node-version
        cache: pnpm

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile

    # Every package resolves @barry-rocks/sdk (and the adapters, and the
    # artifacts bag) through package exports that point into dist/. A fresh
    # checkout has no dist, so without this typecheck, lint and the test lanes
    # fail on unresolved imports instead of checking anything.
    - name: Build the compiled packages
      shell: bash
      run: pnpm build:packages
