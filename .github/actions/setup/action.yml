name: Setup
description: Check out deps toolchain — pnpm, Node (from .node-version), and install with a frozen lockfile.

runs:
  using: composite
  steps:
    - name: Setup pnpm
      uses: pnpm/action-setup@v6
      with:
        version: 10.30.3

    - name: Setup Node
      uses: actions/setup-node@v7
      with:
        node-version-file: .node-version
        cache: pnpm

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile

    - name: Cache pinned devops checks
      uses: actions/cache@v4
      with:
        path: ${{ github.workspace }}/node_modules/.cache/barry-devops
        key: devops-checks-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.github/ci/devops.json') }}
