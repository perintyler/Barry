# What ships to the public GitHub mirror (perintyler/Barry).
#
# `barry release sync` rsyncs the repo to a temp directory, deletes every
# repo-ROOT entry not covered below, and force-pushes the result. This is an
# allowlist on purpose: forget an entry and the mirror breaks loudly (a needed
# file goes missing), which is the safe direction. A denylist would fail the
# other way — forget an entry and a private file ships to a public repo.
#
# Three things are kept WITHOUT being listed here:
#   - every workspace package root, derived from workspace-entries.json
#     (that is why cli/, packages/, servers/ and sdks/ are absent below)
#   - pnpm-lock.yaml, hardcoded in pruneRepoRoot
#   - anything the rsync exclude list already dropped (.env, .env.*, .dev.vars,
#     .claude, .barry, .skills, …) — see cli/src/commands/release.ts
#
# Filtering is ROOT-ONLY and does not recurse: a directory named here ships
# whole. `scripts`, `docs` and `bags` are therefore
# whole-subtree passes — a secret committed inside one of them WILL ship. The
# secret guard is the rsync exclude list, not this file.
#
# The exception is a file entry containing "/" (the .github workflows below),
# which prunes its parent to exactly the paths listed.

public:
  directories:
    - docs
    - scripts
    - bags
    # Short documents on how code here is expected to read. Nothing private,
    # and AGENTS.md links them — a mirror without them would ship a guide whose
    # first section points at files the reader does not have.
    - principles

  files:
    - README.md
    - LICENSE.md
    # No install.sh entry: it moved into scripts/, which already ships whole as
    # a public directory. A root entry naming a file that is no longer there
    # fails check:monorepo, which asserts the allowlist against disk.
    #
    # The tracked template documenting required variables — no values in it.
    # packages/env's validate.test.ts reads it from the repo root, so a mirror
    # without it fails that suite on ENOENT. The rsync layer needs a matching
    # --include, since --exclude=.env.* would otherwise drop it first.
    - .env.example
    - pnpm-workspace.yaml
    - workspace-entries.json
    - publish-filter.yaml
    - package.json
    - tsconfig.projects.json
    - tsconfig.base.json
    - tsconfig.eslint.json
    - vitest.base.config.ts
    - eslint.config.js
    - knip.json
    - .gitignore
    - .npmrc
    - .node-version
    - .swiftlint.yml
    - .qaignore
    # Only these workflows ship; the rest of .github/ is pruned, which is what
    # keeps private deploy workflows out of the mirror.
    - .github/actions/setup/action.yml
    - .github/workflows/lint.yml
    - .github/workflows/verify.yml
    - .github/workflows/_postgres-tests.yml
    - .github/workflows/test-packages.yml
    - .github/workflows/test-cli.yml
    - .github/workflows/test-bags.yml
    - .github/workflows/test-servers.yml
    - .github/workflows/test-macos.yml

# npm packages that must exist on the registry before a prod sync. The mirror's
# install resolves these as real dependencies rather than workspace links, so
# syncing ahead of a publish produces a repo that cannot install. `barry release
# sync prod` exits non-zero when one is missing (override: --allow-unpublished).
publish:
  npm:
    - packages/bags-sdk
