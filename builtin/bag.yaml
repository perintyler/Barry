name: builtin
description: Barry's builtin bags — the collection's own manifest

# This directory's membership is inferred: every bag.yaml below it is a builtin
# bag, registered under the name its manifest declares (sdk/lib/src/host/
# builtin.ts). There is no list of them to keep in sync. Nested bags such as
# filesystem/locks and telemetry/logs register independently because each has
# its own bag.yaml, not because anything names them.
#
# This manifest is the collection's, and it is NOT itself a registered bag: a
# bag's conventional subdirectories (actions/, instructions/, skills/) are
# scanned for content, and here those names are the actions and instructions
# bags. It carries only what the tree cannot say.

# Named bounds Barry ships. Bounds RESTRICT capabilities (deny tools, write
# access, file patterns, bash commands); they can only take away what traits
# granted. A trait names one in its own `bounds:` list.
#
# Seeded into a machine's bounds table when absent (`pnpm --dir sdk/cli
# seed:bags`), never over a row that exists: a machine may have tuned one.
# `barry bag doctor` reports a shipped bound whose live row differs.
bounds:
  readonly:
    description: "Read-only: no file writes, no bash, no outbound write requests"
    bound:
      deniedTools: [Bash, Write, Edit]
      deniedAccess: [write]
      network:
        actions: [write]

  # Denies BOTH the MCP Bash and the provider's native Bash — naming a
  # natively-backed tool in deniedTools drives scopeNeedsNativeToolDenial, which
  # adds `Bash(*)` to the session's permission deny-list. Denying only the MCP
  # copy is what made this bound inert before.
  no-bash:
    description: No bash or shell execution
    bound:
      deniedTools: [Bash]

  no-secrets:
    description: Filesystem access blocked for common secrets and credential files
    bound:
      files:
        deny: ["*.env", ".env.*", ".ssh/**", "*.pem", "*.key", "*.p12", "*.pfx"]

  no-network:
    description: All outbound network access denied
    bound:
      network:
        actions: [all]

  no-network-write:
    description: No outbound network writes — reads allowed
    bound:
      network:
        actions: [write]

  # Enforced by the egress sandbox, not just the app-level guards: outbound
  # traffic is proxied and filtered by hostname, and the agent cannot lift it.
  # An empty allowDomains means nothing but localhost is reachable.
  sandboxed-offline:
    description: "Sandboxed: no outbound network at all (proxy-enforced, agent cannot bypass)"
    bound:
      network:
        actions: [all]
        enforce: sandbox
        allowDomains: []

  # Pairs with the slack bag's `slack-me` trait, which grants the `slack`
  # namespace at readwrite so `send_slack_message_to_self` — the one write tool
  # with no destination parameter — survives. Everything else that can pick a
  # recipient is named here.
  #
  # Denied by NAME, not by `deniedAccess: [write]`: that blunter form would take
  # the self-DM tool with it, leaving the trait read-only and pointless.
  #
  # The list is exhaustive over the slack namespace's write tools as of writing,
  # and `slack-me-tools.test.ts` in the bag fails when a new one appears — an
  # allow-list cannot be expressed here, so a new write tool would otherwise be
  # granted silently the moment it is added.
  slack-self-dm-only:
    description: "Slack: only the self-DM write tool — no tool that can pick a recipient"
    bound:
      deniedTools:
        - send_slack_message
        - send_message_as_user
        - pretty_slacker

# Traits Barry ships: only the two that span every bag. These are COMPOSITES:
# written with no owning bag, and a bag whose auto-trait shares one of these
# names may not take the row over (ensureTraits' shippedTraitNames guard, which
# reads this list). Seeded when absent, like the bounds above, and never over an
# existing row.
#
# Everything else a session gets is a bag's own auto-trait. The default grants
# (DEFAULT_TRAITS: bash, filesystem, sessions, instructions) are builtin bags'
# traits, so what a session gets by default is read off the bags themselves.
# `coding`, `sessions` and `figma` used to be composites here; each collided
# with a bag of the same name that owned the row in practice, and `coding`'s
# collision with ~/repos/bags/coding once stripped Bash from every session.
traits:
  # `read` and `all` cover what ships here: the builtin bags plus the remote
  # registrations below. They deliberately name no namespace from a personal
  # bag — those drift out of existence silently, and every bag already
  # auto-generates a trait of its own name. `notion` is provided by the
  # notion-official registration.
  #
  # `read`'s restriction is the `readonly` bound, not `access`: the grant
  # stays readwrite and the bound carries the restriction, exactly as the
  # retired seeder composed it. If the live row loses that bound, `barry start
  # --read` still prints "read-only" while restricting nothing — which has
  # happened twice. `barry bag doctor` reports it.
  read:
    description: All Barry tools with read-only access
    access: readwrite
    # `session` (singular) was listed here and names no bag — only `sessions`
    # and `sessions-search` exist. A dangling entry in a `bags:` list grants
    # nothing and reports nothing, so it sat here unnoticed; removed with the
    # session -> sessions namespace rename that made it visible.
    bags: [actions, bash, events, figma, filesystem, instructions, locks, notion, sessions, vault]
    bounds: [readonly]

  all:
    description: "All Barry tools: every namespace enabled with full read/write access"
    access: readwrite
    # See `read` above: `session` named no bag and is gone.
    bags: [actions, bash, events, figma, filesystem, instructions, locks, notion, sessions, vault]

# Remote bags Barry ships a registration for. Shipped CONFIGURATION, not
# builtin bags: each becomes its own registry row with its own auto-trait, is
# never marked builtin, and still shows in the capability picker.
remote-bags:
  # Notion's hosted MCP. Named `notion-official` because `notion` is a
  # composition-only PARENT bag (~/repos/bags/notion) that composes this one and
  # reserves a `notion-local` slot. Every tool below stays on the `notion`
  # NAMESPACE — that is what scout, vantage-core and four traits already grant,
  # and a bag's namespace is independent of its name — so the rename is
  # invisible to consumers.
  notion-official:
    url: https://mcp.notion.com/mcp
    tools:
      - { name: notion-fetch, namespace: notion, access: read }
      - { name: notion-search, namespace: notion, access: read }
      - { name: notion-get-comments, namespace: notion, access: read }
      - { name: notion-get-teams, namespace: notion, access: read }
      - { name: notion-get-users, namespace: notion, access: read }
      - { name: notion-query-database-view, namespace: notion, access: read }
      - { name: notion-query-meeting-notes, namespace: notion, access: read }
      - { name: notion-create-comment, namespace: notion, access: write }
      - { name: notion-create-database, namespace: notion, access: write }
      - { name: notion-create-pages, namespace: notion, access: write }
      - { name: notion-create-view, namespace: notion, access: write }
      - { name: notion-duplicate-page, namespace: notion, access: write }
      - { name: notion-move-pages, namespace: notion, access: write }
      - { name: notion-update-data-source, namespace: notion, access: write }
      - { name: notion-update-page, namespace: notion, access: write }
      - { name: notion-update-view, namespace: notion, access: write }

  figma:
    command: npx
    args: ["-y", "mcp-remote", "https://mcp.figma.com/mcp", "--header", "X-Figma-Token: ${FIGMA_API_KEY}"]
    env: [FIGMA_API_KEY]
    tools:
      - { name: get_design_context, namespace: figma, access: read }
      - { name: get_metadata, namespace: figma, access: read }
      - { name: get_screenshot, namespace: figma, access: read }
      - { name: get_variable_defs, namespace: figma, access: read }
      - { name: get_figjam, namespace: figma, access: read }
      - { name: get_code_connect_map, namespace: figma, access: read }
      - { name: get_code_connect_suggestions, namespace: figma, access: read }
      - { name: add_code_connect_map, namespace: figma, access: write }
      - { name: send_code_connect_mappings, namespace: figma, access: write }
      - { name: create_design_system_rules, namespace: figma, access: write }
      - { name: generate_figma_design, namespace: figma, access: write }

  mobile-mcp:
    command: npx
    args: ["-y", "@mobilenext/mobile-mcp@latest"]
    # Drives a connected device/simulator, so it holds state per session. Also
    # near-zero use: eager connection kept an idle npx process resident for the
    # whole life of the MCP server.
    session-scoped: true
