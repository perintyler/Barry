name: sessions-search
description: Semantic search over every past session — finds conversations by meaning, not just by matching words

# No `traits:` block: the auto-trait is already right, and this bag is composed
# INTO `sessions`, whose trait absorbs these namespaces anyway.
#
# It ships no skills, deliberately. Composition pulls a child's skills into the
# parent's auto-trait, so a skill here would land in every session that has the
# sessions trait — which is all of them.

# The tool answers in the `sessions` namespace rather than a namespace of this
# bag's own name: searching what was said in sessions belongs beside the other
# session tools, not in a separate surface a reader has to know to look in.
#
# `search_messages` was `recall`, and it ABSORBED the sessions bag's
# `search_session_messages` — that tool called the same lexical search this one
# uses as its floor, so it was a strict subset. It kept the subset's name (70
# calls, against 8 for `recall`) and `recall`'s behaviour.
tool-metadata:
  - toolName: search_messages
    namespace: sessions
    access: read

tools:
  entry: tools.ts
  # Deferred, matching the parent bag. This tool answers in the `sessions`
  # namespace, so leaving it visible while every other sessions tool is hidden
  # would put exactly one session tool in every context window — the inconsistent
  # half of a decision rather than a discovery aid.
  #
  # Still reachable: `tool_search` searches REGISTERED tools, and composition folds
  # this bag's tools into the parent's auto-trait, which every session holds via
  # `DEFAULT_TRAITS`.
  default_access: deferred

schedules:
  embed:
    # Every 15 minutes, matching bookkeeping. A quiet tick costs one batched
    # count query and zero model calls, so the interval is chosen for freshness
    # rather than to avoid load.
    every: 15m
    action:
      description: Embed new session messages so they can be searched by meaning
      run:
        command: npx
        # sessions-api is the composition root that installs the models the
        # sweep embeds with; see api/src/jobs/embed.ts.
        args: [tsx, ../api/src/jobs/embed.ts]
        working-directory: .
      # Unset names are simply absent from the run's env. The services map form
      # ({source, required}) is accepted here too, to make one required.
      env:
        - SESSION_STORE_TRANSPORT
        - BARRY_SECRET
        - BARRY_OLLAMA_URL
        - BARRY_EMBED_MODEL
        - BARRY_EMBED_MAX_PER_TICK
        - BARRY_VECTORS_DB
      timeout: 15m

scripts:
  backfill-embeddings:
    description: "One-off: embed the entire session archive, not just the recent window"
    # The recurring job looks at a bounded set of sessions — re-counting an
    # archive that will never change again would cost every tick forever — so
    # older sessions are unreachable from it and need a deliberate pass.
    # Local inference, so this costs time (~12 min for 90k messages), not money.
    command: npx
    args: [tsx, ../api/src/jobs/embed.ts]
    working-directory: .
    env:
      - SESSION_STORE_TRANSPORT
      - BARRY_SECRET
      - BARRY_OLLAMA_URL
      - BARRY_EMBED_MODEL
      - BARRY_VECTORS_DB
      - BARRY_EMBED_BACKFILL

# Advisory only. `bag show` flags a missing Ollama; it never blocks, because
# searching an existing index works without it — only building one needs it.
#
# Note what this canNOT express: it checks for a binary, while the real
# requirement is "a daemon is listening and an embedding model is pulled". A
# machine with the app installed and nothing running passes this and still
# cannot embed. `embedModelAvailable()` is what actually answers that, and the
# job calls it before doing any database work.
dependencies:
  - name: ollama
    install: brew install --cask ollama
    reason: Generates the embeddings locally, so the index costs nothing and no session text leaves the machine
