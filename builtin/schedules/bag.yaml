version: v0.1
name: schedules
description: Run actions on a trigger — cron, an interval, or once at a time

requires:
  actions:
    reason: a schedule runs an action, and its runs are action runs

tools:
  entry: tools.ts

services:
  # The one process that runs every schedule. Replaces a launchd plist per job:
  # cron, timezones, one-off `at`, pause and per-run env all need one process
  # holding the whole picture. Its liveness is watched from OUTSIDE — the API
  # alerts on a stale heartbeat (src/health.ts) — because the service
  # health-check is itself a schedule now.
  scheduler:
    description: Fires schedules from every registered bag and records their runs
    command: pnpm
    args: ["exec", "tsx", "src/service.ts"]
    working-directory: .
    env:
      # Agent runs and alerts go through the authenticated API.
      - BARRY_SECRET
      # Handed on to scheduled scripts; the shared shell helpers require it.
      - BARRY_DIR

