version: v0.1
name: vault
description: Barry Vault — encrypted secret store, isolated behind its own user

# The vault is the one service on this machine that must not be readable by the
# sessions it serves. Same UID is same trust, so running it as the invoking user
# means any agent can read what it holds — via `docker inspect` on a container,
# `security find-generic-password` (whose ACL trusts /usr/bin/security, so every
# process satisfies it), the service's own plist, or attaching to the process.
# `user:` is the only thing that closes those — for the DAEMON's own secrets.
# It does not close them for the per-identity vault credentials, which still
# live in the user's login Keychain; see builtin/vault/README.md, "What the
# separate user does not protect".
#
# Installing this service is therefore NOT part of an ordinary `barry pack`:
# it needs a LaunchDaemon, which needs root. Create the account first with
#   sudo builtin/vault/scripts/install-service-account _barryvault "Barry Vault"
# The supervisor never runs a `user:` service; see launchd/README.md.
services:
  api:
    description: Serves the vault's REST API and MCP endpoint over a unix socket, so secrets resolve without the daemon sharing the user's UID
    command: pnpm
    args: ["exec", "tsx", "server/src/index.ts"]
    working-directory: .
    user: _barryvault
    # The socket is the only transport — server/src/listen.ts has no TCP branch.
    # Its 0660 group gate bounds who can connect, but the invoking user is in
    # _barryvault by design (README.md, "Provisioning"; the backup reads the DB as the
    # user), so it does not keep the user's own agent sessions off the API.
    socket: run/vault.sock
    health: /health
    env:
      # The vault's OWN variables, declared by the bag that needs them.
      #
      # The key is what the SERVER reads; `from` is the .env key holding it.
      #
      # The vault's own bootstrap state, generated once into this bag's data
      # directory (src/token-signing-key.ts) and written into the daemon's plist
      # by launchd/generate-plist.mts. The server refuses to start without it.
      JWT_SECRET:
        source: bag-data
        file: token-signing-key
        required: true
      REGISTRATION_SECRET:
        source: .env
        from: BARRY_VAULT_REGISTRATION_SECRET
        required: false
      # Gates POST /api/backup, which hands back the entire encrypted store in
      # one request. Required, unlike REGISTRATION_SECRET above: an unset
      # registration secret means "open enrolment", a coherent posture: an
      # unset backup secret would mean the whole database is available to
      # anything that can reach the socket, which never is. `barry db backup`
      # reads the matching value as BARRY_VAULT_BACKUP_SECRET.
      BACKUP_SECRET:
        source: .env
        from: BARRY_VAULT_BACKUP_SECRET
        required: true
      # The MCP endpoint's bearer gate and the crypto identity it operates as.
      # Read in src/mcp.ts, which app.ts mounts via setupMcp() — so it runs in
      # THIS process, not Barry's MCP server, and never sees context.secrets.
      VAULT_MCP_TOKEN:
        source: .env
        from: BARRY_VAULT_MCP_TOKEN
        required: false
      VAULT_CLIENT_SECRET:
        source: .env
        from: BARRY_VAULT_CLIENT_SECRET
        required: false
      # Read by the CLI rather than the server — `barry db backup` age-encrypts
      # the vault snapshot with the recipient, and the bootstrap account uses
      # the rest. Declared here anyway: they are the vault's variables, and the
      # bag that owns them is the right place to say what they are for.
      VAULT_AGE_RECIPIENT:
        source: .env
        from: BARRY_VAULT_AGE_RECIPIENT
        required: false
      VAULT_MASTER_PASSWORD:
        source: .env
        from: BARRY_VAULT_MASTER_PASSWORD
        required: false
      VAULT_EMAIL:
        source: .env
        from: BARRY_VAULT_EMAIL
        required: false
      VAULT_CLIENT_ID:
        source: .env
        from: BARRY_VAULT_CLIENT_ID
        required: false

# No `traits:` block. The auto-trait `vault` (readwrite over the namespace) is
# what sessions get; a narrower read-only view comes from composing a trait with
# a readonly scope rather than from a second auto-trait.
