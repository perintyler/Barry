version: v0.1
name: identities
description: Identities — who Barry is when it acts, and what each one may reach

# No `apps:` block. BarryIdentities is its own repo now — identities-macos,
# under the identities-ui umbrella — and declares its own build there. This bag
# owns the identity store, its traits and its tools; the app is a client.
#
# The description above changed with it: it used to describe the WINDOW ("a
# windowed app for creating and configuring identities"), which stopped being
# true of this bag the moment the window left.

# Auditing an identity's env bindings against what its enabled bags require.
# This was scripts/audit-identity.ts, where nothing invoked it — it existed
# only as a knip entry allowlist, so its first real caller is this entry.
scripts:
  audit:
    description: Audit an identity's env bindings against the bags it enables
    command: tsx
    args:
      - scripts/audit-identity.ts

services:
  identities:
    description: Identity, trait and bound management — REST API
    command: pnpm
    args: ["exec", "tsx", "server/src/index.ts"]
    working-directory: .
    serves: http
    health: /health
    # Map form so BARRY_SECRET stays REQUIRED.
    env:
      BARRY_SECRET:
        source: .env
        required: true
