version: v0.1
name: actions
description: Validated procedures — find and run Barry actions

requires:
  sessions:
    reason: action runs attach to the session that triggered them

tools:
  entry: tools.ts

services:
  web:
    description: Actions web app — search the catalog and run an action from a browser or phone
    command: pnpm
    args: ["exec", "tsx", "server/src/index.ts"]
    working-directory: .
    serves: http
    health: /health
    env:
      # The API requires BARRY_SECRET; the browser must never hold it, so the
      # server attaches it and re-exposes only the four endpoints the UI needs.
      - BARRY_SECRET

# No `apps:` block. BarryActions is its own repo now — actions-macos, under
# the actions-ui umbrella — and declares its own build there. This bag owns the
# service; the app is a client of it.

scripts:
  skill-to-action:
    description: Convert legacy SKILL.md directories into actions (dry-run unless --write)
    command: npx
    args: [tsx, scripts/skill-to-action.ts]
  sync-skills:
    description: Sync actions from an upstream skills repo, reporting new/changed/removed (dry-run unless --write)
    command: npx
    args: [tsx, scripts/sync-skills.ts]
