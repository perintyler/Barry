version: 1
name: edit
description: Apply a decided source-code change with the smallest edit that expresses it, then prove it did not break the build. Use when you already know what to change — a guard clause, a signature, a conditional, a small refactor — and want the change validated and rolled back rather than left half-applied.
prompt: |-
  # Edit

  Apply this change: ${INPUT.instruction}

  Target: `${INPUT.file_path}`

  ## Before you edit

  Read the file first. Not a grep, not a memory of it — the region you are
  about to replace has to match what is on disk right now, and `Edit` fails
  loudly when it does not. That failure is the useful one; guessing at the
  old text and getting a near-miss is not.

  ## Smallest region that expresses the change

  Replace the smallest span that makes the change true, and no more.

  This is not a style preference. A diff that also renormalizes quotes,
  reflows a comment, or reorders imports buries the one line that matters
  inside forty that do not, and the reviewer who has to find it is the person
  who will be paged when it is wrong. Reformatting is a separate change with a
  separate reason.

  So: `Edit` with an `old_string` scoped to the region, not `Write` with the
  whole file. Reach for `Write` only when the file does not exist yet or the
  change genuinely replaces all of it.

  Constraints that must hold: ${INPUT.constraints}

  ## Prove it

  Run this repo's typecheck or build over the change — `pnpm run build:projects`
  in this monorepo, whatever the project's own gate is elsewhere. If the change
  is behavioral, run the tests that cover it.

  A change that has not been through a gate is a proposal, not an edit.

  ## When the gate fails

  Revert it: `git checkout -- <file>` for an unstaged edit, or `git restore
  --source=HEAD <file>`. Then say what failed and why.

  Do NOT leave a broken edit on disk while you think about it, and do NOT
  stack a second edit on top to fix the first. A reverted file is a known
  state; a half-fixed one is a state nobody has ever tested. Reverting costs
  a re-read and re-apply, which is cheap. Not reverting costs the next person
  their afternoon.

  Report which file changed, what the gate said, and whether anything was
  rolled back.
# Deliberately empty: this action needs no bag. It drives the agent's own
# native Edit/Write/Read, which every adapter provides and no trait grants.
#
# It replaces a `localEdit` tool that shelled a region out to a local Ollama
# model. That tool's reason was token cost — keeping the replacement text out
# of the conversation — and it bought that with a second model's judgment on
# code the agent had already decided how to change, a bespoke prompt template,
# fence-stripping for when the model ignored it, and a hard dependency on a
# running Ollama. The discipline was the part that carried the value, and
# discipline is what a prompt is for.
requires: {}
context: session
input_schema:
  type: object
  properties:
    file_path:
      title: File
      type: string
      description: Path to the file to edit. Absolute preferred.
      x-barry-infer: >-
        The file named in the request. If the request names a symbol rather
        than a path, locate it first and pass the file that defines it.
    instruction:
      title: Instruction
      type: string
      description: What the change should do. Be specific about what to preserve as well as what to change.
    constraints:
      title: Constraints
      type: string
      description: What must NOT change — renames to avoid, formatting to preserve, code to leave alone.
      # A string, not an array: it is interpolated into the prompt as prose and
      # read by a model, so a list would only be joined back into a sentence.
      default: Do not rename anything, do not reformat unrelated code, and do not change behavior the instruction did not ask about.
  required: [file_path, instruction]
