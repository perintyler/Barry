version: v0.1
name: services
description: Barry Services — the health of the instance's supervised services

# The BarryServices menu bar app was folded into Barry Sessions as its Services
# tab (Features/Services in the sessions-macos repo). Three menu bar icons
# for one product meant three login items; the tab asks the same supervisor.

# Verifying no source-run service is serving code older than its last commit.
# It used to be a repo check that nothing called — a check with no caller is a
# check that has never run.
scripts:
  freshness:
    description: Verify no source-run service is serving code older than its last commit
    command: scripts/freshness

schedules:
  health-check:
    # Every 5 minutes. This bag is the one that knows what a healthy service
    # looks like, so the job that decides it lives here rather than in a
    # first-party registry that had to name the bag anyway.
    every: 5m
    action:
      description: "Monitor critical services and alert when down"
      run:
        command: bash
        args:
          - jobs/health-check
      env:
        # SLACK_BOT_TOKEN is read directly by lib.sh's fallback curl path.
        # SMS credentials are deliberately absent: notify resolves those from the
        # profile/vault, so a copy here would never be read.
        - SLACK_BOT_TOKEN
      timeout: 5m

  contract-drift:
    # Hourly, not every 5 minutes. Drift is introduced by a deploy, not by
    # runtime conditions, so a tighter loop would re-run a ~15s suite 288 times
    # a day to catch something that can only change when code ships.
    every: 1h
    action:
      description: "Decode live responses against the strict contracts every generated client is built from"
      run:
        command: bash
        args:
          - jobs/contract-drift
      timeout: 5m
