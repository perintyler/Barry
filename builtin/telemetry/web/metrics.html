<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Barry metric catalog</title>
<link rel="stylesheet" href="/app.css">
<style>
  /* Page-specific only. The nav and every shared token live in app.css. */
  .toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; }
  #q {
    font: inherit; font-size: 13px; padding: 7px 11px; flex: 1; min-width: 220px;
    background: var(--panel); color: var(--ink);
    border: 1px solid var(--line); border-radius: 7px;
  }
  #q:focus-visible { outline: 2px solid var(--series-1); outline-offset: 1px; }
  .count { color: var(--muted); font-size: 12.5px; }

  .group { margin-bottom: 20px; }
  .group h3 {
    font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.07em;
    color: var(--muted); margin: 0 0 8px; font-weight: 600;
  }
  .row {
    display: grid; grid-template-columns: minmax(0, 1fr) auto;
    gap: 6px 14px; align-items: baseline;
    width: 100%; text-align: left; font: inherit;
    padding: 11px 13px; border: 0; border-bottom: 1px solid var(--line);
    background: transparent; color: var(--ink); cursor: pointer;
  }
  .row:last-child { border-bottom: 0; }
  .row:hover { background: color-mix(in srgb, var(--series-1) 6%, transparent); }
  .row[aria-expanded="true"] { background: color-mix(in srgb, var(--series-1) 9%, transparent); }
  .row:focus-visible { outline: 2px solid var(--series-1); outline-offset: -2px; }
  .row .mname { font: 12.5px ui-monospace, "SF Mono", Menlo, monospace; }
  .row .val { font-weight: 620; font-variant-numeric: proportional-nums; white-space: nowrap; }
  .row .desc { grid-column: 1 / -1; color: var(--muted); font-size: 12.5px; max-width: 82ch; }
  .unit {
    font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.05em;
    color: var(--muted); border: 1px solid var(--line);
    padding: 1px 5px; border-radius: 4px; margin-left: 7px;
  }
  /* "Declared but never collected" is a real state and must not read as zero. */
  .nodata { color: var(--muted); font-weight: 500; font-style: italic; }

  .detail { padding: 13px; border-top: 1px solid var(--line); }
  .detail .chart { margin-top: 10px; }
  /* Height matches the viewBox drawSpark is given (110), so x and y scale
     equally and the end marker stays round. */
  .detail .chart, .detail .chart svg { height: 170px; }
  /* Bounded height: a metric with 27 label sets would otherwise push the chart
     off the screen entirely. Scrolls instead of growing. */
  .chips {
    display: flex; gap: 7px; flex-wrap: wrap; margin-bottom: 4px;
    max-height: 92px; overflow-y: auto;
  }
  .chip {
    font: 11.5px ui-monospace, "SF Mono", Menlo, monospace; cursor: pointer;
    background: var(--panel); color: var(--muted);
    border: 1px solid var(--line); border-radius: 6px; padding: 3px 8px;
  }
  .chip[aria-pressed="true"] { color: var(--ink); border-color: var(--muted); font-weight: 600; }
  .chip:focus-visible { outline: 2px solid var(--series-1); outline-offset: 1px; }
  .windows { display: flex; gap: 6px; }
  .windows button {
    font: inherit; font-size: 12px; padding: 3px 9px; cursor: pointer;
    background: var(--panel); color: var(--muted);
    border: 1px solid var(--line); border-radius: 6px;
  }
  .windows button[aria-pressed="true"] { color: var(--ink); border-color: var(--muted); font-weight: 600; }
  /* A panel that could not load, bordered so it cannot be mistaken for one that
     loaded and found nothing. Same treatment the usage pages use. */
  .down {
    padding: 11px 13px; border-left: 3px solid var(--crit);
    background: color-mix(in srgb, var(--crit) 7%, transparent);
  }
  .down b { color: var(--crit); }
</style>
</head>
<body>
<header>
  <h1>Barry metric catalog</h1>
  <span class="sub" id="stamp">loading…</span>
  <!--nav-->
</header>

<main>
  <section>
    <div class="toolbar">
      <input id="q" type="search" placeholder="Search metrics by name or meaning…"
             aria-label="Search metrics" autocomplete="off">
      <span class="count" id="count"></span>
    </div>
    <div class="panel" id="catalog"><div class="empty">loading…</div></div>
  </section>
</main>

<footer>
  Every metric this bag collects. Select one to chart it; a metric with no
  recent points says so rather than drawing a zero.
  <p class="healthlink"><a href="/health">/health</a> — this dashboard's own liveness endpoint.</p>
</footer>

<script type="module" src="/catalog.js"></script>
</body>
</html>
