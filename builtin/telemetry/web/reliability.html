<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Barry reliability</title>
<link rel="stylesheet" href="/app.css">
<style>
  .windows { display: flex; gap: 6px; }
  .windows button {
    font: inherit; font-size: 12px; padding: 3px 9px; cursor: pointer;
    background: var(--panel); color: var(--muted);
    border: 1px solid var(--line); border-radius: 6px;
  }
  .windows button[aria-pressed="true"] { color: var(--ink); border-color: var(--muted); font-weight: 600; }
  .down {
    padding: 11px 13px; border-left: 3px solid var(--crit);
    background: color-mix(in srgb, var(--crit) 7%, transparent);
  }
  .down b { color: var(--crit); }
  .note { padding: 9px 13px; font-size: 12px; color: var(--muted); border-bottom: 1px solid var(--line); }
  .bar { height: 6px; border-radius: 3px; background: var(--series-1); opacity: 0.85; min-width: 2px; }
  .bar.warn { background: var(--warn); }
  .bar.crit { background: var(--crit); }
  @media (forced-colors: active) { .bar { background: Highlight; } }
</style>
</head>
<body>
<header>
  <h1>Barry reliability</h1>
  <span class="sub" id="stamp">loading…</span>
  <!--nav-->
</header>

<main>
  <section>
    <h2>Stuck action runs</h2>
    <div class="panel scroll" id="stuck"></div>
  </section>

  <section>
    <h2>Lost session messages</h2>
    <div class="panel scroll" id="dropped"></div>
  </section>

  <section>
    <h2>Action outcomes</h2>
    <div class="panel scroll" id="actions"></div>
  </section>

  <section>
    <h2>Session outcomes</h2>
    <div class="panel scroll" id="outcomes"></div>
  </section>

  <section>
    <h2>Events</h2>
    <div class="panel scroll" id="events"></div>
  </section>
</main>

<footer>
  <p class="healthlink"><a href="/health">/health</a> — this dashboard's own liveness endpoint.</p>
</footer>

<script type="module">
import { $, esc, schedulePolling } from "/spark.js";

const WINDOWS = [{ days: 7, label: "7d" }, { days: 30, label: "30d" }, { days: 90, label: "90d" }];
let windowDays = 30;

const num = (v) => Number(v ?? 0).toLocaleString();

function renderState(el, panel) {
  if (!panel) {
    el.innerHTML = '<div class="down"><b>✖ no response</b> — the server returned no panel.</div>';
    return false;
  }
  if (panel.state === "unavailable") {
    el.innerHTML = `<div class="down"><b>✖ unavailable</b> — ${esc(panel.reason)}</div>`;
    return false;
  }
  if (panel.state === "empty") {
    el.innerHTML = `<div class="empty">${esc(panel.explanation)}</div>`;
    return false;
  }
  return true;
}

function table(el, panel, header, rows, note) {
  if (!renderState(el, panel)) return;
  const data = rows(panel.data);
  const max = Math.max(1, ...data.map((r) => Number(r.weight ?? 0)));
  el.innerHTML = (note ? `<div class="note">${note}</div>` : "") + `<table>
    <thead><tr>${header.map((h) => `<th class="${h.num ? "num" : ""}">${esc(h.label)}</th>`).join("")}</tr></thead>
    <tbody>${data.map((r) => `<tr>${r.cells.map((c, i) => {
      const bar = i === r.cells.length - 1 && r.weight !== undefined && Number(r.weight) > 0
        ? `<div class="bar ${r.level ?? ""}" style="width:${Math.max(2, (Number(r.weight) / max) * 100)}%"></div>` : "";
      return `<td class="${header[i].num ? "num" : ""}">${c}${bar}</td>`;
    }).join("")}</tr>`).join("")}</tbody>
  </table>`;
}

/** Status is never colour alone — every failed row also carries a glyph. */
function statusCell(status) {
  if (/^(failed|error)$/i.test(status)) return `<span class="bad">✖ ${esc(status)}</span>`;
  if (/^(started|running|pending)$/i.test(status)) return `<span class="warnv">◷ ${esc(status)}</span>`;
  return esc(status);
}

async function refresh() {
  let body;
  try {
    body = await (await fetch(`/api/usage/health?days=${windowDays}`)).json();
  } catch (err) {
    $("stamp").textContent = "dashboard unreachable";
    for (const id of ["stuck", "actions", "outcomes", "events"]) {
      $(id).innerHTML = `<div class="down"><b>✖ unreachable</b> — ${esc(String(err))}</div>`;
    }
    return;
  }
  $("stamp").textContent = `last ${windowDays}d · updated ${new Date(body.generatedAt).toLocaleTimeString()}`;

  // Not windowed on purpose: a run stuck for two weeks would fall out of a 7-day
  // window exactly as it became most worth reporting.
  table($("stuck"), body.stuck,
    [{ label: "Action" }, { label: "Bag" }, { label: "Status" }, { label: "Open", num: true }, { label: "Oldest", num: true }],
    (d) => d.map((r) => ({
      cells: [esc(r.action), esc(r.bag), statusCell(r.status), num(r.open), `${Number(r.oldest_hours).toFixed(0)}h`],
      weight: r.oldest_hours,
      level: Number(r.oldest_hours) > 24 ? "crit" : "warn",
    })),
    "Runs that started and never finished. Shown regardless of the window above.");

  // Dropped batches are silent data loss: the API logs "N messages dropped" and
  // moves on, so 776 messages went missing before anything surfaced them — found
  // seven weeks later while looking for something else.
  const dropped = body.dropped ?? { batches: 0, messages: 0, byCause: {} };
  $("dropped").innerHTML = dropped.messages === 0
    ? '<div class="empty">No session messages have been dropped.</div>'
    : `<div class="note">Session history the API could not persist and gave up on. These
        messages are gone; the count is cumulative over the current log file.</div>
       <table>
         <thead><tr><th>Cause</th><th class="num">Messages lost</th></tr></thead>
         <tbody>${Object.entries(dropped.byCause).map(([cause, n]) => `
           <tr><td>${/HTTP 5/.test(cause) ? `<span class="bad">✖ ${esc(cause)}</span>` : `<span class="warnv">${esc(cause)}</span>`}</td>
               <td class="num">${num(n)}<div class="bar crit" style="width:${Math.max(2, (Number(n) / dropped.messages) * 100)}%"></div></td></tr>`).join("")}
           <tr><td><b>Total</b></td><td class="num"><b>${num(dropped.messages)}</b> in ${num(dropped.batches)} batches</td></tr>
         </tbody>
       </table>`;

  table($("actions"), body.actions,
    [{ label: "Action" }, { label: "Status" }, { label: "Avg" }, { label: "Runs", num: true }],
    (d) => d.map((r) => ({
      cells: [
        esc(r.action),
        statusCell(r.status),
        r.avg_s === null ? '<span class="dim">—</span>' : `${Number(r.avg_s).toFixed(0)}s`,
        num(r.runs),
      ],
      weight: r.runs,
      level: /fail/i.test(r.status) ? "crit" : "",
    })));

  table($("outcomes"), body.outcomes,
    [{ label: "Status" }, { label: "Sessions", num: true }],
    (d) => d.map((r) => ({
      cells: [statusCell(r.status), num(r.sessions)],
      weight: r.sessions,
      level: /fail/i.test(r.status) ? "crit" : "",
    })));

  table($("events"), body.events,
    [{ label: "Type" }, { label: "Severity" }, { label: "Source" }, { label: "Count", num: true }],
    (d) => d.map((r) => ({
      cells: [esc(r.type), statusCell(r.severity), esc(r.source), num(r.events)],
      weight: r.events,
      level: r.severity === "error" ? "crit" : r.severity === "warning" ? "warn" : "",
    })));
}

function renderWindows() {
  $("windows").innerHTML = WINDOWS.map((w) =>
    `<button type="button" data-days="${w.days}" aria-pressed="${w.days === windowDays}">${w.label}</button>`).join("");
  for (const btn of $("windows").querySelectorAll("button")) {
    btn.addEventListener("click", () => {
      windowDays = Number(btn.dataset.days);
      renderWindows();
      refresh();
    });
  }
}

renderWindows();
// Paused while this tab is backgrounded, and refreshed immediately on return
// rather than waiting out the rest of a stale 60s interval.
schedulePolling(refresh, 60000);
</script>
</body>
</html>
