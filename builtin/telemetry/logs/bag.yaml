name: logs
description: The log line format, the emitters that write it, and the store that keeps it

# A LIBRARY sub-bag: no tools, no services, no jobs.
#
# It exists to put the two ends of one contract in one place. The emitter
# (what every Barry process calls to write a line) and `parseLine` (what the
# ingester calls to read one back) lived in separate REPOSITORIES, so nothing
# could import both and nothing could test the pair. The measured cost: every
# Cloudflare Worker log line was silently discarded, because the Workers
# emitter hand-built `level: "info"` and `ts:` while the parser required a
# numeric level and `time`.
#
# WHY COLLECTION IS NOT HERE. `ingestLog`, `defaultLogSources`, the
# `ingest-logs` job and the read models stay in the parent bag, which imports
# this one. `engine` and twelve other packages depend on this sub-bag to EMIT;
# none of them should acquire a dependency on a collector to do it. A broken
# ingest job must not be able to break a process that only wanted to log.
#
# Parent -> child is the sanctioned direction and the point of defining
# sub-bags inside a parent. Do NOT add an import from here back up into
# bags/telemetry: that inverts it and drags the collector into every consumer.
#
# No `tools:` entry on purpose — the telemetry tools stay on the parent's
# `metrics` namespace. Splitting them would rename user-visible tools for no
# gain.
