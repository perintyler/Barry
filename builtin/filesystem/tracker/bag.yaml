name: tracker
description: The append-only record of every file change Barry's sessions make

# The bag is `tracker`; its tools stamp `filesystem`. Without this block the
# bag-name fallback in ownNamespaces() would invent a `tracker` namespace that no
# tool carries, and shipped-namespaces.test.ts fails the build — which is the
# guard working, not a nuisance to route around.
#
# Sharing `filesystem` is deliberate. Change tracking is not an opt-in
# capability: it records what the file tools do, and every session already has it
# (the bag is in ALWAYS_ON_BAGS). Folding it in REMOVES a namespace rather than
# adding one, and the tools land on the existing mcp__filesystem__* surface.
#
# `locks` is the opposite case and deliberately keeps its own namespace — it must
# stay gated behind the `locks` trait, and a namespace is the unit a trait grants.
tool-metadata:
  - { toolName: status, namespace: filesystem, access: read }
  - { toolName: list_changes, namespace: filesystem, access: read }
  - { toolName: get_change, namespace: filesystem, access: read }
  - { toolName: get_change_stats, namespace: filesystem, access: read }
  - { toolName: get_changes_for_file, namespace: filesystem, access: read }
  - { toolName: get_changes_for_session, namespace: filesystem, access: read }
  - { toolName: search_changes, namespace: filesystem, access: read }

tools:
  entry: tools.ts
  # Nothing here is needed to make a change — the record is written by the
  # session's change-tracker hook. These read it back after the fact, so keep
  # them out of every session's tool list and let tool_search surface them.
  deferred:
    - status
    - list_changes
    - get_change
    - get_change_stats
    - get_changes_for_file
    - get_changes_for_session
    - search_changes
