name: filesystem
description: File read, write, glob, and grep operations

# `tracker` is absorbed; `locks` deliberately is NOT — and the omission is the
# point, not an oversight.
#
# generateAutoTraits() folds every sub-bag's namespaces into the parent's trait,
# transitively. Listing `locks` here would make the auto-generated `filesystem`
# trait grant the `locks` namespace, and since the `coding` trait grants
# `filesystem` to every default session, every session would get the locks tools.
# That destroys the one property locks needs: it is opt-in, enabled only when the
# `locks` trait is used. It lives in ./locks, is registered independently, and
# carries its own auto-trait.
#
# Do not "fix" this by adding `locks` below. The guard is
# sdk/bag-host/src/__tests__ plus the gate test — adding it should turn them red.
bags:
  - tracker

tools:
  entry: tools.ts

dependencies:
  - name: rg
    install: brew install ripgrep
    reason: powers the Glob and Grep tools
