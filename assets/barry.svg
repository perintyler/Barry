<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <!-- Deep dark green-black background -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1a1f14"/>
      <stop offset="50%" stop-color="#0f1209"/>
      <stop offset="100%" stop-color="#080a05"/>
    </radialGradient>
    
    <!-- Subtle gear/circle pattern in background -->
    <pattern id="bgPattern" patternUnits="userSpaceOnUse" width="100" height="100">
      <rect width="100" height="100" fill="transparent"/>
      <circle cx="50" cy="50" r="20" fill="none" stroke="#1a1f14" stroke-width="1" opacity="0.2"/>
      <circle cx="50" cy="50" r="35" fill="none" stroke="#1a1f14" stroke-width="0.5" opacity="0.15"/>
    </pattern>
    
    <!-- Golden-olive fur gradient -->
    <linearGradient id="furGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9a8a30"/>
      <stop offset="30%" stop-color="#7d7028"/>
      <stop offset="70%" stop-color="#5f5518"/>
      <stop offset="100%" stop-color="#4a4210"/>
    </linearGradient>
    
    <!-- Bill gradient - dark brown/mauve -->
    <linearGradient id="billGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5a4848"/>
      <stop offset="50%" stop-color="#4a3a3a"/>
      <stop offset="100%" stop-color="#3a2a2a"/>
    </linearGradient>
    
    <!-- Dark swirling lens interior -->
    <radialGradient id="lensInner" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#3a3530"/>
      <stop offset="50%" stop-color="#2a2520"/>
      <stop offset="100%" stop-color="#1a1510"/>
    </radialGradient>
    
    <!-- Orange goggle frame gradient -->
    <linearGradient id="orangeFrame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffaa44"/>
      <stop offset="50%" stop-color="#ff8822"/>
      <stop offset="100%" stop-color="#dd6600"/>
    </linearGradient>
    
    <!-- Glowing halo gradient (yellow-orange) -->
    <linearGradient id="haloGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffdd55"/>
      <stop offset="40%" stop-color="#ffcc33"/>
      <stop offset="100%" stop-color="#ff9900"/>
    </linearGradient>
    
    <!-- Halo outer glow -->
    <radialGradient id="haloGlow" cx="50%" cy="80%" r="80%">
      <stop offset="0%" stop-color="#ff6600" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#ff4400" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ff2200" stop-opacity="0"/>
    </radialGradient>
    
    <!-- Bronze/copper ring color -->
    <linearGradient id="ringColor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b6545"/>
      <stop offset="100%" stop-color="#6b4530"/>
    </linearGradient>
    
    <!-- Green book color -->
    <linearGradient id="bookGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a7a4a"/>
      <stop offset="50%" stop-color="#3a6a3a"/>
      <stop offset="100%" stop-color="#2a5a2a"/>
    </linearGradient>
    
    <!-- Steel/gray for bridge -->
    <linearGradient id="steelAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8899aa"/>
      <stop offset="50%" stop-color="#6a7a8a"/>
      <stop offset="100%" stop-color="#4a5a6a"/>
    </linearGradient>
    
    <!-- Orange text -->
    <linearGradient id="textOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff8833"/>
      <stop offset="100%" stop-color="#ff6600"/>
    </linearGradient>
    
    <!-- Glow filters -->
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <filter id="haloBlur" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <filter id="innerShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feOffset dx="1" dy="2"/>
      <feGaussianBlur stdDeviation="2" result="offset-blur"/>
      <feComposite operator="out" in="SourceGraphic" in2="offset-blur" result="inverse"/>
      <feFlood flood-color="#000" flood-opacity="0.4" result="color"/>
      <feComposite operator="in" in="color" in2="inverse" result="shadow"/>
      <feComposite operator="over" in="shadow" in2="SourceGraphic"/>
    </filter>
    
    <!-- Orange spark particle -->
    <radialGradient id="spark">
      <stop offset="0%" stop-color="#ff8844" stop-opacity="1"/>
      <stop offset="50%" stop-color="#ff6622" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ff4400" stop-opacity="0"/>
    </radialGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="400" fill="url(#bgGlow)"/>
  <rect width="400" height="400" fill="url(#bgPattern)" opacity="0.5"/>
  
  <!-- Bronze outer rings -->
  <circle cx="200" cy="200" r="170" fill="none" stroke="url(#ringColor)" stroke-width="1.5" opacity="0.5">
    <animate attributeName="r" values="168;173;168" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.4;0.6;0.4" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="200" cy="200" r="150" fill="none" stroke="url(#ringColor)" stroke-width="1" opacity="0.35">
    <animate attributeName="r" values="148;153;148" dur="4s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Floating orange sparks -->
  <g>
    <circle cx="65" cy="115" r="3" fill="url(#spark)">
      <animate attributeName="cy" values="115;90;115" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;1;0.8" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="335" cy="145" r="2.5" fill="url(#spark)">
      <animate attributeName="cy" values="145;120;145" dur="4.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="55" cy="295" r="2" fill="url(#spark)" opacity="0.6">
      <animate attributeName="cy" values="295;275;295" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="345" cy="315" r="2.5" fill="url(#spark)">
      <animate attributeName="cy" values="315;295;315" dur="5.5s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- Main character -->
  <g transform="translate(200, 195)">
    
    <!-- Body -->
    <ellipse cx="0" cy="105" rx="60" ry="42" fill="url(#furGradient)" filter="url(#innerShadow)"/>
    
    <!-- Body horizontal stripes texture -->
    <g opacity="0.12">
      <ellipse cx="0" cy="80" rx="50" ry="3" fill="#3a3210"/>
      <ellipse cx="0" cy="90" rx="55" ry="3" fill="#3a3210"/>
      <ellipse cx="0" cy="100" rx="58" ry="3" fill="#3a3210"/>
      <ellipse cx="0" cy="110" rx="55" ry="3" fill="#3a3210"/>
      <ellipse cx="0" cy="120" rx="45" ry="3" fill="#3a3210"/>
    </g>
    
    <!-- Green book -->
    <g transform="translate(0, 100)">
      <!-- Book shape -->
      <path d="M-22 -8 L0 -20 L22 -8 L22 22 L0 10 L-22 22 Z" fill="url(#bookGreen)" stroke="#1a3a1a" stroke-width="2"/>
      <!-- Book spine -->
      <line x1="0" y1="-20" x2="0" y2="10" stroke="#1a3a1a" stroke-width="2"/>
      <!-- Page blocks on each side -->
      <rect x="-18" y="-2" width="14" height="10" rx="1" fill="#2a4a2a"/>
      <rect x="4" y="-2" width="14" height="10" rx="1" fill="#2a4a2a"/>
    </g>
    
    <!-- Head -->
    <ellipse cx="0" cy="0" rx="72" ry="62" fill="url(#furGradient)" filter="url(#innerShadow)"/>
    
    <!-- Subtle swirl/texture marks on face -->
    <g opacity="0.15">
      <ellipse cx="-45" cy="5" rx="10" ry="8" fill="#3a3210"/>
      <ellipse cx="48" cy="-8" rx="8" ry="10" fill="#3a3210"/>
      <ellipse cx="-52" cy="-28" rx="6" ry="8" fill="#3a3210"/>
      <ellipse cx="52" cy="15" rx="7" ry="9" fill="#3a3210"/>
      <ellipse cx="-20" cy="35" rx="5" ry="4" fill="#3a3210"/>
      <ellipse cx="25" cy="38" rx="6" ry="4" fill="#3a3210"/>
    </g>
    
    <!-- Bill -->
    <ellipse cx="0" cy="42" rx="38" ry="20" fill="url(#billGradient)"/>
    <ellipse cx="0" cy="40" rx="33" ry="16" fill="#4a3a3a" opacity="0.5"/>
    
    <!-- Bill nostrils -->
    <ellipse cx="-10" cy="36" rx="3" ry="2" fill="#2a1a1a"/>
    <ellipse cx="10" cy="36" rx="3" ry="2" fill="#2a1a1a"/>
    
    <!-- Cute smile -->
    <path d="M-14 46 Q0 56 14 46" fill="none" stroke="#1a0a0a" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Goggle strap behind head -->
    <path d="M-58 -8 Q-65 -22 -55 -35 Q0 -50 55 -35 Q65 -22 58 -8" 
          fill="none" stroke="#5a5550" stroke-width="7" stroke-linecap="round" opacity="0.6"/>
    
    <!-- Dark goggle lenses -->
    <g>
      <!-- Left lens interior with swirl effect -->
      <circle cx="-26" cy="-8" r="26" fill="url(#lensInner)"/>
      <!-- Swirl lines in left lens -->
      <g opacity="0.3">
        <ellipse cx="-26" cy="-8" rx="18" ry="15" fill="none" stroke="#4a4540" stroke-width="2"/>
        <ellipse cx="-26" cy="-8" rx="12" ry="10" fill="none" stroke="#4a4540" stroke-width="1.5"/>
        <ellipse cx="-26" cy="-8" rx="6" ry="5" fill="none" stroke="#4a4540" stroke-width="1"/>
      </g>
      
      <!-- Right lens interior with swirl effect -->
      <circle cx="26" cy="-8" r="26" fill="url(#lensInner)"/>
      <!-- Swirl lines in right lens -->
      <g opacity="0.3">
        <ellipse cx="26" cy="-8" rx="18" ry="15" fill="none" stroke="#4a4540" stroke-width="2"/>
        <ellipse cx="26" cy="-8" rx="12" ry="10" fill="none" stroke="#4a4540" stroke-width="1.5"/>
        <ellipse cx="26" cy="-8" rx="6" ry="5" fill="none" stroke="#4a4540" stroke-width="1"/>
      </g>
      
      <!-- Subtle yellow reflection arc in each lens -->
      <path d="M-38 -16 Q-26 -22 -14 -16" fill="none" stroke="#ffcc66" stroke-width="2" stroke-linecap="round" opacity="0.35"/>
      <path d="M14 -16 Q26 -22 38 -16" fill="none" stroke="#ffcc66" stroke-width="2" stroke-linecap="round" opacity="0.35"/>
    </g>
    
    <!-- Orange goggle frames -->
    <g filter="url(#softGlow)">
      <!-- Left frame -->
      <circle cx="-26" cy="-8" r="28" fill="none" stroke="url(#orangeFrame)" stroke-width="4"/>
      <!-- Right frame -->
      <circle cx="26" cy="-8" r="28" fill="none" stroke="url(#orangeFrame)" stroke-width="4"/>
      
      <!-- Bridge connector -->
      <rect x="-5" y="-14" width="10" height="10" rx="2" fill="url(#steelAccent)"/>
      
      <!-- Side rivets -->
      <circle cx="-52" cy="-8" r="2.5" fill="url(#steelAccent)"/>
      <circle cx="52" cy="-8" r="2.5" fill="url(#steelAccent)"/>
    </g>
    
    <!-- Glowing halo/hard hat -->
    <g filter="url(#haloBlur)">
      <ellipse cx="0" cy="-55" rx="52" ry="14" fill="url(#haloGlow)"/>
    </g>
    <ellipse cx="0" cy="-52" rx="48" ry="11" fill="url(#haloGradient)">
      <animate attributeName="opacity" values="0.95;1;0.95" dur="2s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="0" cy="-54" rx="42" ry="8" fill="#ffdd55" opacity="0.7"/>
    <ellipse cx="0" cy="-56" rx="32" ry="4" fill="#ffee88" opacity="0.5"/>
    
  </g>
  
  <!-- BARRY label -->
  <g transform="translate(200, 370)">
    <rect x="-55" y="-15" width="110" height="30" rx="4" fill="#0a0c08" stroke="url(#ringColor)" stroke-width="2"/>
    <text x="0" y="7" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="url(#textOrange)" text-anchor="middle" letter-spacing="8" font-weight="bold">BARRY</text>
  </g>
  
</svg>
