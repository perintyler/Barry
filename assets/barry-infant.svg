<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <!-- Gradient for the mystical background -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1a2a4a"/>
      <stop offset="50%" stop-color="#0d1929"/>
      <stop offset="100%" stop-color="#050a12"/>
    </radialGradient>
    
    <!-- Code matrix pattern -->
    <pattern id="codeMatrix" patternUnits="userSpaceOnUse" width="60" height="60">
      <rect width="60" height="60" fill="transparent"/>
      <text x="5" y="12" font-family="monospace" font-size="8" fill="#1e3a5f" opacity="0.4">01</text>
      <text x="25" y="28" font-family="monospace" font-size="8" fill="#1e3a5f" opacity="0.3">fn</text>
      <text x="10" y="44" font-family="monospace" font-size="8" fill="#1e3a5f" opacity="0.35">{}</text>
      <text x="40" y="55" font-family="monospace" font-size="8" fill="#1e3a5f" opacity="0.25">;</text>
      <text x="45" y="15" font-family="monospace" font-size="8" fill="#1e3a5f" opacity="0.3">=></text>
    </pattern>
    
    <!-- Fur texture gradient -->
    <linearGradient id="furGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B6914"/>
      <stop offset="30%" stop-color="#6B4E0A"/>
      <stop offset="70%" stop-color="#5a4008"/>
      <stop offset="100%" stop-color="#4a3506"/>
    </linearGradient>
    
    <!-- Bill gradient -->
    <linearGradient id="billGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5c4a4a"/>
      <stop offset="50%" stop-color="#4a3838"/>
      <stop offset="100%" stop-color="#3a2828"/>
    </linearGradient>
    
    <!-- Glasses lens reflection -->
    <linearGradient id="lensGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ff88" stop-opacity="0.1"/>
      <stop offset="40%" stop-color="#00aaff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#8855ff" stop-opacity="0.2"/>
    </linearGradient>
    
    <!-- Gold accent gradient -->
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd700"/>
      <stop offset="50%" stop-color="#daa520"/>
      <stop offset="100%" stop-color="#b8860b"/>
    </linearGradient>
    
    <!-- Subtle glow filter -->
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Inner shadow for depth -->
    <filter id="innerShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feOffset dx="2" dy="3"/>
      <feGaussianBlur stdDeviation="3" result="offset-blur"/>
      <feComposite operator="out" in="SourceGraphic" in2="offset-blur" result="inverse"/>
      <feFlood flood-color="#000" flood-opacity="0.4" result="color"/>
      <feComposite operator="in" in="color" in2="inverse" result="shadow"/>
      <feComposite operator="over" in="shadow" in2="SourceGraphic"/>
    </filter>
    
    <!-- Ambient particle -->
    <radialGradient id="particle">
      <stop offset="0%" stop-color="#00ff88" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#00ff88" stop-opacity="0"/>
    </radialGradient>
  </defs>
  
  <!-- Background layers -->
  <rect width="400" height="400" fill="url(#bgGlow)"/>
  <rect width="400" height="400" fill="url(#codeMatrix)" opacity="0.6"/>
  
  <!-- Ambient glow ring -->
  <circle cx="200" cy="200" r="160" fill="none" stroke="#00ff88" stroke-width="1" opacity="0.15">
    <animate attributeName="r" values="155;165;155" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.15;0.25;0.15" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="200" cy="200" r="140" fill="none" stroke="#00aaff" stroke-width="0.5" opacity="0.1">
    <animate attributeName="r" values="138;145;138" dur="3s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Floating code particles -->
  <g opacity="0.6">
    <circle cx="80" cy="100" r="2" fill="url(#particle)">
      <animate attributeName="cy" values="100;80;100" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;1;0.6" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="320" cy="150" r="1.5" fill="url(#particle)">
      <animate attributeName="cy" values="150;130;150" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="50" cy="280" r="1" fill="#00aaff" opacity="0.5">
      <animate attributeName="cy" values="280;265;280" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="350" cy="300" r="2" fill="url(#particle)">
      <animate attributeName="cy" values="300;285;300" dur="5.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="100" cy="350" r="1.5" fill="#8855ff" opacity="0.4">
      <animate attributeName="cy" values="350;335;350" dur="4.5s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- Main character group -->
  <g transform="translate(200, 200)">
    
    <!-- Body/shoulders hint with vest -->
    <ellipse cx="0" cy="95" rx="70" ry="40" fill="url(#furGradient)" filter="url(#innerShadow)"/>
    
    <!-- Vest detail -->
    <path d="M-35 75 L-25 120 L0 130 L25 120 L35 75 L15 85 L0 80 L-15 85 Z" fill="#2a2a35" opacity="0.9"/>
    <path d="M-30 78 L-22 115 L0 123 L22 115 L30 78" fill="none" stroke="url(#goldAccent)" stroke-width="1.5"/>
    
    <!-- Collar/shirt hint -->
    <path d="M-15 75 L0 90 L15 75" fill="none" stroke="#d4d4dc" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Head -->
    <ellipse cx="0" cy="0" rx="75" ry="65" fill="url(#furGradient)" filter="url(#innerShadow)"/>
    
    <!-- Fur texture lines -->
    <g stroke="#4a3506" stroke-width="0.5" opacity="0.3">
      <path d="M-60 -20 Q-50 -15 -55 -5"/>
      <path d="M-55 10 Q-45 15 -50 25"/>
      <path d="M60 -20 Q50 -15 55 -5"/>
      <path d="M55 10 Q45 15 50 25"/>
      <path d="M-30 -50 Q-25 -45 -28 -35"/>
      <path d="M30 -50 Q25 -45 28 -35"/>
    </g>
    
    <!-- Bill -->
    <ellipse cx="0" cy="35" rx="45" ry="22" fill="url(#billGradient)"/>
    <ellipse cx="0" cy="32" rx="40" ry="18" fill="#5a4848" opacity="0.6"/>
    <!-- Bill nostrils -->
    <ellipse cx="-12" cy="30" rx="4" ry="2.5" fill="#3a2828"/>
    <ellipse cx="12" cy="30" rx="4" ry="2.5" fill="#3a2828"/>
    <!-- Bill highlight -->
    <ellipse cx="-15" cy="25" rx="8" ry="4" fill="#6a5858" opacity="0.4"/>
    
    <!-- Eyes (behind glasses) -->
    <g>
      <!-- Left eye white -->
      <ellipse cx="-28" cy="-15" rx="18" ry="16" fill="#f5f5f0"/>
      <!-- Left iris -->
      <circle cx="-28" cy="-13" r="10" fill="#1a1a2e"/>
      <!-- Left pupil -->
      <circle cx="-28" cy="-13" r="5" fill="#000"/>
      <!-- Left eye highlight -->
      <circle cx="-32" cy="-17" r="3" fill="#fff" opacity="0.9"/>
      <circle cx="-25" cy="-10" r="1.5" fill="#fff" opacity="0.5"/>
      
      <!-- Right eye white -->
      <ellipse cx="28" cy="-15" rx="18" ry="16" fill="#f5f5f0"/>
      <!-- Right iris -->
      <circle cx="28" cy="-13" r="10" fill="#1a1a2e"/>
      <!-- Right pupil -->
      <circle cx="28" cy="-13" r="5" fill="#000"/>
      <!-- Right eye highlight -->
      <circle cx="24" cy="-17" r="3" fill="#fff" opacity="0.9"/>
      <circle cx="31" cy="-10" r="1.5" fill="#fff" opacity="0.5"/>
    </g>
    
    <!-- Glasses -->
    <g filter="url(#softGlow)">
      <!-- Left lens frame -->
      <ellipse cx="-28" cy="-15" rx="24" ry="21" fill="none" stroke="url(#goldAccent)" stroke-width="3"/>
      <!-- Left lens -->
      <ellipse cx="-28" cy="-15" rx="22" ry="19" fill="url(#lensGlow)"/>
      
      <!-- Right lens frame -->
      <ellipse cx="28" cy="-15" rx="24" ry="21" fill="none" stroke="url(#goldAccent)" stroke-width="3"/>
      <!-- Right lens -->
      <ellipse cx="28" cy="-15" rx="22" ry="19" fill="url(#lensGlow)"/>
      
      <!-- Bridge -->
      <path d="M-5 -15 Q0 -20 5 -15" fill="none" stroke="url(#goldAccent)" stroke-width="2.5"/>
      
      <!-- Temple arms hint -->
      <line x1="-52" y1="-18" x2="-65" y2="-25" stroke="url(#goldAccent)" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="52" y1="-18" x2="65" y2="-25" stroke="url(#goldAccent)" stroke-width="2.5" stroke-linecap="round"/>
    </g>
    
    <!-- Code reflection in glasses -->
    <g opacity="0.35">
      <text x="-38" y="-20" font-family="monospace" font-size="6" fill="#00ff88">fn()</text>
      <text x="-36" y="-10" font-family="monospace" font-size="5" fill="#00aaff">{...}</text>
      <text x="18" y="-18" font-family="monospace" font-size="5" fill="#00ff88">const</text>
      <text x="20" y="-8" font-family="monospace" font-size="6" fill="#00aaff">=></text>
    </g>
    
    <!-- Subtle knowing smile on bill -->
    <path d="M-15 40 Q0 48 15 40" fill="none" stroke="#3a2828" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Eyebrow hints -->
    <path d="M-45 -38 Q-28 -45 -12 -40" fill="none" stroke="#4a3506" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M45 -38 Q28 -45 12 -40" fill="none" stroke="#4a3506" stroke-width="2.5" stroke-linecap="round"/>
    
  </g>
  
  <!-- Name badge / signature element -->
  <g transform="translate(200, 360)">
    <rect x="-50" y="-12" width="100" height="24" rx="4" fill="#0d1929" stroke="url(#goldAccent)" stroke-width="1"/>
    <text x="0" y="5" font-family="Georgia, serif" font-size="14" fill="url(#goldAccent)" text-anchor="middle" letter-spacing="3">BARRY</text>
  </g>
  
  <!-- Corner accent - subtle geometric -->
  <g opacity="0.2">
    <path d="M0 0 L40 0 L40 5 L5 5 L5 40 L0 40 Z" fill="url(#goldAccent)"/>
    <path d="M400 400 L360 400 L360 395 L395 395 L395 360 L400 360 Z" fill="url(#goldAccent)"/>
  </g>
  
</svg>
