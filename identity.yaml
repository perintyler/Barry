name: base
displayName: Base
description: Base bags every session starts with, optional base bags, and bounds Barry ships

bags:
  # Enabled by default in every session:
  - artifacts
  - bash
  - filesystem
  - instructions
  - sessions
  # Installed on the identity (services/stores run; selectable in session picker):
  - actions: { optional: true }
  - decisions: { optional: true }
  - embeddings: { optional: true }
  - events: { optional: true }
  - identities: { optional: true }
  - mcp: { optional: true }
  - memory: { optional: true }
  - nodes: { optional: true }
  - schedules: { optional: true }
  - session-vector-search: { optional: true }
  - telemetry: { optional: true }

bounds:
  - readonly:
      optional: true
      description: "Denies supported write tools, shell execution, and recognized network writes; best effort, not a sandbox"
      tools:
        deny: [ "*:write", "*:Bash", "*:Write", "*:Edit" ]
      network:
        deny: [ write ]

  - no-secrets:
      optional: true
      description: "Denies reading or writing common secret paths and withholds unguarded native file/shell tools; best effort, not a filesystem sandbox"
      files:
        deny: [ "*.env", ".env.*", ".ssh/**", "*.pem", "*.key", "*.p12", "*.pfx" ]

  - no-network:
      optional: true
      description: "Denies recognized network commands and tools; best effort, not a sandbox"
      network:
        deny: [ all ]

  - no-network-write:
      optional: true
      description: "Denies recognized network writes while allowing reads; best effort, not a sandbox"
      network:
        deny: [ write ]

  - sandboxed-offline:
      optional: true
      description: "Requests proxy enforcement on supported harnesses; others fall back to guards with a diagnostic"
      network:
        enforce: sandbox
        allow: []
        deny: [ all ]

tool_discovery: provider

adapters:
  claude-code:
    default: true
