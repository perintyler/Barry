<html lang="en">
<head>

  <title>Barry Vault</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0f1117; --surface: #1a1d27; --border: #2a2d3a;
      --text: #e4e4e7; --muted: #71717a; --accent: #6366f1;

      --radius: 8px; --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      --mono: 'SF Mono', 'Fira Code', monospace;

    body { font-family: var(--font); background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; }
    .container { max-width: 640px; width: 100%; margin: 0 auto; padding: 2rem 1rem; flex: 1; display: flex; flex-direction: column; }

    input, button { font-family: var(--font); font-size: 0.875rem; }
    input {
      width: 100%; padding: 0.625rem 0.75rem; background: var(--surface);

    #vault-screen, #detail-screen { flex: 1; }

</head>
<body>
  <div class="container">
    <!-- Login Screen -->
    <div id="login-screen">
      <div class="field">
        <label for="email">Email</label>
        <input id="email" type="email" placeholder="you@example.com" autocomplete="email">
      </div>
      <div class="field">
        <label for="master-password">Password</label>
        <input id="master-password" type="password" placeholder="Enter password">
      </div>
      <div id="login-error" class="error hidden"></div>
      <div class="row mt-1">
        <button id="login-btn" class="btn btn-primary grow">Unlock</button>
      </div>
    </div>

    <!-- Vault List Screen -->
    <div id="vault-screen" class="hidden">
      <div class="toolbar">
        <h1>Vault</h1>
        <div class="row">
          <button id="add-btn" class="btn btn-primary btn-sm">+ Add</button>
          <button id="logout-btn" class="btn btn-ghost btn-sm">Lock</button>
        </div>
      </div>
      <input id="search" class="search search-full" type="text" placeholder="Search items...">
      <div id="items-list"></div>
    </div>

    <!-- Item Detail Screen -->
    <div id="detail-screen" class="hidden">
      <span id="detail-back" class="back">&larr; Back</span>
      <div class="toolbar">
        <h1 id="detail-name"></h1>
        <div class="row">
          <button id="edit-btn" class="btn btn-ghost btn-sm">Edit</button>
          <button id="delete-btn" class="btn btn-danger btn-sm">Delete</button>
        </div>
      </div>
      <div id="detail-fields"></div>
    </div>

    <!-- Add/Edit Modal -->
    <div id="modal" class="modal-overlay hidden">
      <div class="modal">
        <h2 id="modal-title">Add Item</h2>
        <div class="field"><label>Name</label><input id="m-name"></div>
        <div class="field"><label>Username</label><input id="m-username"></div>
        <div class="field"><label>Password</label><input id="m-password" type="password"></div>
        <div class="field"><label>URI</label><input id="m-uri"></div>
        <div class="field"><label>Notes</label><input id="m-notes"></div>
        <div id="modal-error" class="error hidden"></div>
        <div class="modal-actions">
          <button id="modal-cancel" class="btn btn-ghost">Cancel</button>
          <button id="modal-save" class="btn btn-primary">Save</button>
        </div>
      </div>
    </div>

    <div id="toast" class="toast"></div>
  </div>

  <script>
    // Vault Web UI — all crypto happens in the browser
    const API = location.origin;
    let session = null; // { token, encKey, macKey }
    let items = [];
    let currentItem = null;
    let editingId = null;

    // --- Crypto (Web Crypto API) ---
    async function pbkdf2(password, salt, iterations, keyLen) {
      const enc = new TextEncoder();
      const key = await crypto.subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveBits']);
      const bits = await crypto.subtle.deriveBits({ name: 'PBKDF2', salt: enc.encode(salt), iterations, hash: 'SHA-256' }, key, keyLen * 8);
      return new Uint8Array(bits);
    }

    async function pbkdf2Raw(keyMaterial, salt, iterations, keyLen) {
      const key = await crypto.subtle.importKey('raw', keyMaterial, 'PBKDF2', false, ['deriveBits']);
      const saltBuf = typeof salt === 'string' ? new TextEncoder().encode(salt) : salt;
      const bits = await crypto.subtle.deriveBits({ name: 'PBKDF2', salt: saltBuf, iterations, hash: 'SHA-256' }, key, keyLen * 8);
      return new Uint8Array(bits);
    }

    async function hkdfExpand(masterKey, info, length) {
      const key = await crypto.subtle.importKey('raw', masterKey, 'HKDF', false, ['deriveBits']);
      const bits = await crypto.subtle.deriveBits({ name: 'HKDF', hash: 'SHA-256', salt: new Uint8Array(0), info: new TextEncoder().encode(info) }, key, length * 8);
      return new Uint8Array(bits);
    }

    async function deriveKeys(masterPassword, email, kdfSalt) {
      const salt = kdfSalt ? `${email.toLowerCase()}:${kdfSalt}` : email.toLowerCase();
      const masterKey = await pbkdf2(masterPassword, salt, 600000, 32);
      const encKey = await hkdfExpand(masterKey, 'enc', 32);
      const macKey = await hkdfExpand(masterKey, 'mac', 32);
      const masterPasswordHash = bufToBase64(await pbkdf2Raw(masterKey, masterPassword, 1, 32));
      return { masterKey, encKey, macKey, masterPasswordHash };
    }

    async function encryptField(plaintext, encKey, macKey) {
      const iv = crypto.getRandomValues(new Uint8Array(16));
      const key = await crypto.subtle.importKey('raw', encKey, { name: 'AES-CBC' }, false, ['encrypt']);
      const ct = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-CBC', iv }, key, new TextEncoder().encode(plaintext)));
      const hmacKey = await crypto.subtle.importKey('raw', macKey, { name: 'HMAC', hash: 'SHA-256' }, false, ['sign']);
      const macData = new Uint8Array(iv.length + ct.length);
      macData.set(iv); macData.set(ct, iv.length);
      const mac = new Uint8Array(await crypto.subtle.sign('HMAC', hmacKey, macData));
      return '2.' + bufToBase64(iv) + '|' + bufToBase64(ct) + '|' + bufToBase64(mac);
    }

    async function decryptField(encString, encKey, macKey) {
      const parts = encString.split('.');
      if (parts[0] !== '2') throw new Error('Unsupported encryption');
      const [ivB64, ctB64, macB64] = parts[1].split('|');
      const iv = base64ToBuf(ivB64), ct = base64ToBuf(ctB64), mac = base64ToBuf(macB64);
      const hmacKey = await crypto.subtle.importKey('raw', macKey, { name: 'HMAC', hash: 'SHA-256' }, false, ['verify']);
      const macData = new Uint8Array(iv.length + ct.length);
      macData.set(iv); macData.set(ct, iv.length);
      const valid = await crypto.subtle.verify('HMAC', hmacKey, mac, macData);
      if (!valid) throw new Error('MAC verification failed');
      const key = await crypto.subtle.importKey('raw', encKey, { name: 'AES-CBC' }, false, ['decrypt']);
      const plain = await crypto.subtle.decrypt({ name: 'AES-CBC', iv }, key, ct);
      return new TextDecoder().decode(plain);
    }

    function bufToBase64(buf) { return btoa(String.fromCharCode(...new Uint8Array(buf))); }
    function base64ToBuf(b64) { return Uint8Array.from(atob(b64), c => c.charCodeAt(0)); }

    async function decryptSymmetricKey(encString, encKey, macKey) {
      const raw = await decryptField(encString, encKey, macKey);
      const bytes = new Uint8Array(raw.length);
      for (let i = 0; i < raw.length; i++) bytes[i] = raw.charCodeAt(i);
      return { encKey: bytes.slice(0, 32), macKey: bytes.slice(32, 64) };
    }

    // --- API ---
    async function apiLogin(email, masterPassword) {
      // Fetch KDF salt for this account
      const saltRes = await fetch(API + '/api/auth/salt', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: email.toLowerCase() })
      });
      const { salt: kdfSalt } = saltRes.ok ? await saltRes.json() : { salt: null };

      const { masterPasswordHash, encKey, macKey } = await deriveKeys(masterPassword, email, kdfSalt);
      const res = await fetch(API + '/api/auth/token', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: email.toLowerCase(), masterPasswordHash })
      });
      if (!res.ok) throw new Error('Invalid credentials');
      const data = await res.json();
      const itemKeys = await decryptSymmetricKey(data.encryptedKey, encKey, macKey);
      return { token: data.token, encKey: itemKeys.encKey, macKey: itemKeys.macKey };
    }

    async function apiListItems() {
      const res = await fetch(API + '/api/items', { headers: { Authorization: 'Bearer ' + session.token } });
      if (!res.ok) throw new Error('Failed to list items');
      const data = await res.json();
      const decrypted = [];
      for (const item of data.items) {
        try {
          decrypted.push({ ...item, name: await decryptField(item.name, session.encKey, session.macKey) });
        } catch { /* skip undecryptable */ }
      }
      return decrypted;
    }

    async function apiGetItem(id) {
      const res = await fetch(API + '/api/items/' + id, { headers: { Authorization: 'Bearer ' + session.token } });
      if (!res.ok) throw new Error('Item not found');
      const raw = await res.json();
      return {
        id: raw.id,
        name: raw.name ? await decryptField(raw.name, session.encKey, session.macKey) : '',
        username: raw.username ? await decryptField(raw.username, session.encKey, session.macKey) : null,
        password: raw.password ? await decryptField(raw.password, session.encKey, session.macKey) : null,
        uri: raw.uri ? await decryptField(raw.uri, session.encKey, session.macKey) : null,
        notes: raw.notes ? await decryptField(raw.notes, session.encKey, session.macKey) : null,
      };
    }

    async function apiCreateItem(item) {
      const body = { name: await encryptField(item.name, session.encKey, session.macKey), type: 1 };
      if (item.username) body.username = await encryptField(item.username, session.encKey, session.macKey);
      if (item.password) body.password = await encryptField(item.password, session.encKey, session.macKey);
      if (item.uri) body.uri = await encryptField(item.uri, session.encKey, session.macKey);
      if (item.notes) body.notes = await encryptField(item.notes, session.encKey, session.macKey);
      const res = await fetch(API + '/api/items', {
        method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + session.token },
        body: JSON.stringify(body)
      });
      if (!res.ok) throw new Error('Failed to create item');
    }

    async function apiUpdateItem(id, fields) {
      const body = {};
      for (const [k, v] of Object.entries(fields)) {
        body[k] = v ? await encryptField(v, session.encKey, session.macKey) : null;
      }
      await fetch(API + '/api/items/' + id, {
        method: 'PUT', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + session.token },
        body: JSON.stringify(body)
      });
    }

    async function apiDeleteItem(id) {
      await fetch(API + '/api/items/' + id, {
        method: 'DELETE', headers: { Authorization: 'Bearer ' + session.token }
      });
    }

    // --- UI ---
    const $ = id => document.getElementById(id);

    function showScreen(name) {
      for (const s of ['login-screen', 'vault-screen', 'detail-screen']) {
        $(s).classList.toggle('hidden', s !== name + '-screen');
      }
    }

    function toast(msg) {
      const t = $('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2000);
    }

    function renderItems(filter = '') {
      const list = $('items-list');
      const filtered = filter ? items.filter(i => i.name.toLowerCase().includes(filter.toLowerCase())) : items;
      if (filtered.length === 0) {
        list.innerHTML = '<div class="empty">' + (filter ? 'No matching items' : 'No items yet. Click + Add to create one.') + '</div>';
        return;
      }
      list.innerHTML = filtered.map(i => `
        <div class="card" data-id="${i.id}">
          <div class="card-name">${esc(i.name)}</div>
          <div class="card-meta">${i.updated_at ? new Date(i.updated_at).toLocaleDateString() : ''}</div>
        </div>
      `).join('');
      list.querySelectorAll('.card').forEach(card => {
        card.addEventListener('click', () => showDetail(card.dataset.id));
      });
    }

    async function showDetail(id) {
      try {
        currentItem = await apiGetItem(id);
        $('detail-name').textContent = currentItem.name;
        const fields = $('detail-fields');
        fields.innerHTML = '';
        for (const [label, value] of [['Username', currentItem.username], ['Password', currentItem.password], ['URI', currentItem.uri], ['Notes', currentItem.notes]]) {
          if (!value) continue;
          const isPassword = label === 'Password';
          const row = document.createElement('div');
          row.className = 'detail-row';
          row.innerHTML = `
            <span class="detail-label">${label}</span>
            <span class="detail-value ${isPassword ? 'password-dots' : ''}" data-revealed="${!isPassword}">${isPassword ? '••••••••' : esc(value)}</span>
            <span class="row gap-md">
              ${isPassword ? '<span class="copy-btn toggle-pw">show</span>' : ''}
              <span class="copy-btn copy" data-value="${esc(value)}">copy</span>
            </span>
          `;
          fields.appendChild(row);
          row.querySelector('.copy')?.addEventListener('click', (e) => {
            navigator.clipboard.writeText(e.target.dataset.value);
            toast('Copied');
          });
          row.querySelector('.toggle-pw')?.addEventListener('click', (e) => {
            const valEl = row.querySelector('.detail-value');
            const revealed = valEl.dataset.revealed === 'true';
            valEl.textContent = revealed ? '••••••••' : value;
            valEl.dataset.revealed = String(!revealed);
            valEl.classList.toggle('password-dots', revealed);
            e.target.textContent = revealed ? 'show' : 'hide';
          });
        }
        showScreen('detail');
      } catch (err) {
        toast('Error: ' + err.message);
      }
    }

    function openModal(editing = null) {
      editingId = editing?.id ?? null;
      $('modal-title').textContent = editing ? 'Edit Item' : 'Add Item';
      $('m-name').value = editing?.name ?? '';
      $('m-username').value = editing?.username ?? '';
      $('m-password').value = editing?.password ?? '';
      $('m-uri').value = editing?.uri ?? '';
      $('m-notes').value = editing?.notes ?? '';
      $('modal-error').classList.add('hidden');
      $('modal').classList.remove('hidden');
      $('m-name').focus();
    }

    function closeModal() { $('modal').classList.add('hidden'); }

    function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

    // --- Events ---
    $('login-btn').addEventListener('click', async () => {
      const email = $('email').value.trim();
      const pw = $('master-password').value;
      if (!email || !pw) return;
      $('login-btn').disabled = true;
      $('login-error').classList.add('hidden');
      try {
        session = await apiLogin(email, pw);
        items = await apiListItems();
        renderItems();
        showScreen('vault');
      } catch (err) {
        $('login-error').textContent = err.message;
        $('login-error').classList.remove('hidden');
      }
      $('login-btn').disabled = false;
    });

    $('master-password').addEventListener('keydown', e => { if (e.key === 'Enter') $('login-btn').click(); });

    $('logout-btn').addEventListener('click', async () => {
      if (session?.token) {
        fetch(API + '/api/auth/logout', { method: 'POST', headers: { Authorization: 'Bearer ' + session.token } }).catch(() => {});
      }
      session = null; items = []; currentItem = null;
      $('email').value = ''; $('master-password').value = '';
      showScreen('login');
    });

    $('search').addEventListener('input', e => renderItems(e.target.value));
    $('add-btn').addEventListener('click', () => openModal());

    $('detail-back').addEventListener('click', async () => {
      items = await apiListItems();
      renderItems($('search').value);
      showScreen('vault');
    });

    $('edit-btn').addEventListener('click', () => { if (currentItem) openModal(currentItem); });

    $('delete-btn').addEventListener('click', async () => {
      if (!currentItem || !confirm('Delete "' + currentItem.name + '"?')) return;
      await apiDeleteItem(currentItem.id);
      items = await apiListItems();
      renderItems($('search').value);
      showScreen('vault');
      toast('Deleted');
    });

    $('modal-cancel').addEventListener('click', closeModal);
    $('modal').addEventListener('click', e => { if (e.target === $('modal')) closeModal(); });

    $('modal-save').addEventListener('click', async () => {
      const name = $('m-name').value.trim();
      if (!name) { $('modal-error').textContent = 'Name is required'; $('modal-error').classList.remove('hidden'); return; }
      $('modal-save').disabled = true;
      try {
        const fields = { name, username: $('m-username').value || undefined, password: $('m-password').value || undefined, uri: $('m-uri').value || undefined, notes: $('m-notes').value || undefined };
        if (editingId) { await apiUpdateItem(editingId, fields); toast('Updated'); }
        else { await apiCreateItem(fields); toast('Created'); }
        closeModal();
        items = await apiListItems();
        renderItems($('search').value);
        if (editingId && currentItem) { await showDetail(editingId); }
      } catch (err) {
        $('modal-error').textContent = err.message;
        $('modal-error').classList.remove('hidden');
      }
      $('modal-save').disabled = false;
    });
  </script>
</body>
