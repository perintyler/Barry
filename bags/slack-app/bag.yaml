version: v0.1
name: slack-app
description: Slack app — inbound events, slash commands, and @barry mentions become sessions

# Named slack-app (not slack): the `slack` bag (~/repos/bags/slack) is the
# OUTBOUND Web-API tool wrapper; this bag is the INBOUND app the Slack
# platform delivers to. Same split as github-app vs the git tools bag.

services:
  events:
    description: Slack webhook receiver (events, slash commands, mentions API)
    command: pnpm
    args: ["exec", "tsx", "src/index.ts"]
    working-directory: .
    # 4863, same rule as github-app's 4861: a bag binds the port it declares
    # (no dev/prod offset), and this endpoint is reached from outside — the
    # tunnel fronting Slack's deliveries points at 4863, where this service has
    # always listened in prod. The slack tools bag's mentions API also calls
    # this port.
    port: 4863
    health: /health
    run-at-load: true
    keep-alive: true
    env:
      # These match what the retired hand-managed com.barry.slack plist carried.
      # SLACK_BOT_TOKEN/SIGNING_SECRET are app-level (one Slack app per deploy),
      # sourced from .env like the previous plist — not per-barry credentials.
      SLACK_BOT_TOKEN:
        source: .env
      SLACK_SIGNING_SECRET:
        source: .env
      BARRY_SECRET:
        source: .env
      BARRY_ENV:
        source: .env
        required: false
      NODE_ENV:
        source: .env
        required: false
      ENABLE_AXIOM_LOGS:
        source: .env
        required: false
      ENABLE_LOCAL_LOGS:
        source: .env
        required: false
