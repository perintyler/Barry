name: keychain
description: macOS Keychain access

tools:
  entry: tools.ts
  # Granted to every session (keychain is in DEFAULT_TRAITS) but kept out of
  # tools/list: credential plumbing is rarely the task at hand, and 11 always-
  # visible tools is a standing context cost for every session that never
  # touches the keychain. Deferred tools stay callable and surface through
  # `tool_search`, which is how a session that DOES need them finds them.
