name: point-guard
description: Persistent supervisor brain — delegates coding subtasks to disposable vendor agents, verifies evidence, integrates accepted work

# Worker runs are registered as Barry session rows so the reaper and the
# session apps see them; requiring the bag here fails at load time instead of
# confusingly at first delegation.
requires:
  sessions:
    reason: worker runs are recorded as session rows for liveness and history

# Phase A ships the claude worker only; cursor-agent/codex are Phase C and
# deliberately not declared yet so `bag show` does not warn about binaries the
# code cannot use.
dependencies:
  - name: claude
    install: npm i -g @anthropic-ai/claude-code
    reason: the headless one-shot worker and the restricted diff judge

tools:
  entry: tools.ts
  env:
    - BARRY_DATABASE_URL
    - BARRY_SECRET
  # Callable but hidden from tools/list; discoverable via tool_search.
  deferred:
    - list_delegations
    - cancel_delegation

services:
  point-guard:
    description: Point-guard service — brain loop, worker scheduler, verifier, merge queue
    command: pnpm
    args: ["exec", "tsx", "server/src/index.ts"]
    working-directory: .
    port: 3868
    health: /health
    run-at-load: true
    keep-alive: true
    env:
      # Map form so a missing DB URL FAILS THE INSTALL rather than reaching
      # the service as "" and silently defaulting to barry_dev.
      BARRY_DATABASE_URL:
        source: .env
        required: true
      BARRY_SECRET:
        source: .env
        required: true
      # Declared here so the bag SAYS what it needs; resolved at service
      # startup through the active identity's vault access — never written
      # into the plist (a plist-frozen secret outlives rotation). item
      # defaults to the variable name, field to "password" — exactly what
      # `barry identity env set OPENAI_API_KEY --source vault` creates.
      OPENAI_API_KEY:
        source: vault
        # bux's existing item (verified valid against /v1/models 2026-09-11)
        # — no new vault setup needed.
        item: VANTAGE_OPENAI_API_KEY
      # Plain text on purpose: a model id is configuration, not a secret.
      # gpt-6-astra is the account's flagship per its live /v1/models list;
      # edit freely — a wrong id fails loudly at the brain's first turn.
      BARRY_POINT_GUARD_MODEL: gpt-6-astra

# No `traits:` block. The auto-trait `point-guard` (readwrite over the
# namespace) is exactly right; hand-declaring it would duplicate the name —
# same reasoning as bags/approvals.
