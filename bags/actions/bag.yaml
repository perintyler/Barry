version: v0.1
name: actions
description: Validated procedures — find and run Barry actions

requires:
  sessions:
    reason: action runs attach to the session that triggered them

tools:
  entry: tools.ts

services:
  web:
    description: Actions web app — search the catalog and run an action from a browser or phone
    command: pnpm
    args: ["exec", "tsx", "server/src/index.ts"]
    working-directory: .
    port: 4890
    health: /health
    host: actions.barry.lan
    # Published through the shared cloudflared tunnel so an action can be run
    # from the phone — `host` above only resolves via /etc/hosts. The origin
    # has no auth of its own AND POST /api/trigger spawns a live agent, so the
    # Cloudflare Access application "Barry Actions"
    # (cloudflare_zero_trust_access_application.barry_actions in
    # infra/cloudflare/access.tf) is the only thing between the internet and
    # an agent running on this machine. Apply that app FIRST and confirm it is
    # live before adding the DNS record — see the ordering note in dns.tf.
    tunnel:
      hostname: actions.barry.rocks
    env:
      # The API requires BARRY_SECRET; the browser must never hold it, so the
      # server attaches it and re-exposes only the four endpoints the UI needs.
      - BARRY_SECRET
    run-at-load: true
    keep-alive: true

apps:
  BarryActions:
    description: Read action runs — their inputs, prompt, and deliverable
    platform: macos
    build:
      command: actions-app/build.sh
      output: actions-app/.build/BarryActions.app
    bundle-id: com.barry.actions
    # Not a login item, and no menu bar icon — the same call BarryIdentities
    # makes. Reading a wrap-up report is occasional work, so the app is opened
    # on demand and quits with its window; keeping a process resident, and a
    # second Barry icon in the menu bar, would both be a cost with no return.
    login-item: false

scripts:
  skill-to-action:
    description: Convert legacy SKILL.md directories into actions (dry-run unless --write)
    command: npx
    args: [tsx, scripts/skill-to-action.ts]
