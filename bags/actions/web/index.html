<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Actions</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="/app.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
</head>
<body>
  <header>
    <h1>Actions</h1>
    <nav class="seg" id="tabs" aria-label="View">
      <button data-view="run" class="cur" aria-pressed="true">Run</button>
      <button data-view="runs" aria-pressed="false">History</button>
    </nav>
  </header>

  <main>
    <!-- Run: search the catalog, pick one, fill the form, go. -->
    <section id="run-view">
      <input id="search" type="search" placeholder="Search actions…" autocomplete="off"
             spellcheck="false" aria-label="Search actions" aria-controls="results">
      <div id="results" role="listbox" aria-label="Matching actions"></div>
    </section>

    <!-- History: what has been run, newest first. -->
    <section id="runs-view" hidden>
      <div id="runs" aria-live="polite"></div>
    </section>
  </main>

  <!-- Detail overlay: the trigger form, and the run report. -->
  <div id="sheet" hidden>
    <div id="sheet-card" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
      <div class="sheet-top">
        <button id="sheet-close" aria-label="Close">‹</button>
        <span id="sheet-title"></span>
      </div>
      <div id="sheet-body"></div>
    </div>
  </div>

  <div id="toast" role="status" aria-live="polite" hidden></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
