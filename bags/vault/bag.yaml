version: v0.1
name: vault
description: Barry Vault — encrypted secret store, isolated behind its own user

# The vault is the one service on this machine that must not be readable by the
# sessions it serves. Same UID is same trust, so running it as the invoking user
# means any agent can read what it holds — via `docker inspect` on a container,
# `security find-generic-password` (whose ACL trusts /usr/bin/security, so every
# process satisfies it), the service's own plist, or attaching to the process.
# `user:` is the only thing that actually closes those. See docs/bags.md.
#
# Installing this service is therefore NOT part of an ordinary `barry pack`:
# it needs a LaunchDaemon, which needs root. Create the account first with
#   sudo scripts/launchd/install-service-account _barryvault "Barry Vault"
# and launchd setup will skip the service (loudly) until that exists.
services:
  api:
    description: Vault API, MCP endpoint and web UI
    command: pnpm
    args: ["exec", "tsx", "server/src/index.ts"]
    working-directory: .
    user: _barryvault
    # The socket is the isolated path. During the transition the server ALSO
    # listens on loopback TCP so existing clients keep working; that listener
    # goes away once packages/vault and the CLI resolve the socket, and only
    # then is the boundary actually closed.
    socket: run/vault.sock
    health: /health
    run-at-load: true
    keep-alive: true
    env:
      # The vault's OWN variables, declared here rather than in the repo's root
      # .env.example: the bag that needs them is the thing that should say so.
      #
      # The key is what the SERVER reads; `from` is the .env key holding it.
      # They differ here and always have — server/src/app.ts reads JWT_SECRET
      # while .env holds BARRY_VAULT_JWT_SECRET. Before `from` existed only one
      # name could be written, so `required: true` pointed at a key .env does
      # not contain and never fired. The vault runs anyway because its plist was
      # written with the real values, and README.md notes those are baked in and
      # never re-read at runtime — so the broken requirement was invisible.
      #
      # Required: the server refuses to start without it, and a vault that
      # starts with a generated-on-the-fly secret would silently invalidate
      # every token already issued against the database.
      JWT_SECRET:
        source: .env
        from: BARRY_VAULT_JWT_SECRET
        required: true
      REGISTRATION_SECRET:
        source: .env
        from: BARRY_VAULT_REGISTRATION_SECRET
        required: false
      # The MCP endpoint's bearer gate and the crypto identity it operates as.
      # Read in src/mcp.ts, which app.ts mounts via setupMcp() — so it runs in
      # THIS process, not Barry's MCP server, and never sees context.secrets.
      VAULT_MCP_TOKEN:
        source: .env
        from: BARRY_VAULT_MCP_TOKEN
        required: false
      VAULT_CLIENT_SECRET:
        source: .env
        from: BARRY_VAULT_CLIENT_SECRET
        required: false
      # Read by the CLI rather than the server — `barry db backup` age-encrypts
      # the vault snapshot with the recipient, and the bootstrap account uses
      # the rest. Declared here anyway: they are the vault's variables, and the
      # bag that owns them is the right place to say what they are for.
      VAULT_AGE_RECIPIENT:
        source: .env
        from: BARRY_VAULT_AGE_RECIPIENT
        required: false
      VAULT_MASTER_PASSWORD:
        source: .env
        from: BARRY_VAULT_MASTER_PASSWORD
        required: false
      VAULT_EMAIL:
        source: .env
        from: BARRY_VAULT_EMAIL
        required: false
      VAULT_CLIENT_ID:
        source: .env
        from: BARRY_VAULT_CLIENT_ID
        required: false

# No `traits:` block. The auto-trait `vault` (readwrite over the namespace) is
# what sessions get; a narrower read-only view comes from composing a trait with
# a readonly scope rather than from a second auto-trait.
