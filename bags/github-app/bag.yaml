version: v0.1
name: github-app
description: GitHub App — answers @barry mentions on issues and pull requests

services:
  webhook:
    description: GitHub App webhook receiver
    command: pnpm
    args: ["exec", "tsx", "server/src/index.ts"]
    working-directory: .
    # 4861, not 3861. A bag binds the port it declares — there is no
    # dev/prod offset the way `servers/*` had one — and this endpoint is
    # reached from outside: the Cloudflare tunnel that fronts GitHub's
    # deliveries points at 4861, which is where the service has always
    # listened in prod. Declaring 3861 here would move the listener out from
    # under the tunnel and silently drop every real webhook.
    port: 4861
    health: /health
    run-at-load: true
    keep-alive: true
    # No credentials here. Service env is written into a launchd plist at
    # install time, so the webhook secret, the OAuth client secret and the app
    # private key would all sit in a world-readable file that rotation never
    # reaches. They resolve per delivery from the barry the delivery concerns
    # instead — which is also what makes the receiver multi-tenant.
    env:
      # BARRY_SECRET and GITHUB_CLIENT_ID are not credentials in the sense the
      # schema guards against — the client id is public, and BARRY_SECRET is
      # already in every other service's plist — and validateEnv refuses to
      # start without them.
      BARRY_SECRET:
        source: .env
      GITHUB_CLIENT_ID:
        source: .env
      GITHUB_APP_ID:
        source: .env
        # Optional: an installation claimed by a barry resolves its app id from
        # that barry, and only an unclaimed one falls back to this.
        required: false
      GITHUB_INSTALLATION_ID:
        source: .env
        required: false
      # A path, not a key — the file it points at is 0600 and never enters the
      # plist. Written as a literal because it is a fixed location rather than
      # deploy config, and the old hand-installed plist hardcoded it too.
      GITHUB_PRIVATE_KEY_PATH: $HOME/.barry/secrets/github-app-private-key.pem
      GITHUB_ALLOWED_USER:
        source: .env
        required: false
      BARRY_ENV:
        source: .env
        required: false
      NODE_ENV:
        source: .env
        required: false
