name: artifacts
description: Artifacts — hosted pages and files. Full SDK parity (list/read/search/upload, namespaces) with MCP-Apps inline viewer.

bags:
  - slackbot

tools:
  entry: tools.ts
  env:
    - ARTIFACTS_SDK_WORKER_URL
    - ARTIFACTS_SDK_NAMESPACE
    - ARTIFACTS_SDK_AUTH_HEADER
    - ARTIFACTS_SDK_APP_URL

deployments:
  backend:
    description: Durable Object + R2 artifacts backend (worker barry-artifacts)
    provider: cloudflare
    worker: barry-artifacts
    config: deploy/backend/wrangler.jsonc
    url: https://barry-artifacts.platypus-0f4.workers.dev
    health: /health
    build:
      command: pnpm
      args: ["--filter", "@barry-sdks/artifacts", "build"]
  app:
    description: Google-OAuth gateway at artifacts.barry.rocks (worker barry-artifacts-app)
    provider: cloudflare
    worker: barry-artifacts-app
    config: deploy/app/wrangler.jsonc
    url: https://artifacts.barry.rocks
    health: /health
    depends-on: [backend]
    secrets: [GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET, ALLOWED_EMAILS, ARTIFACTS_WORKER_URL]

# Access backstop: the entry module carries the same metadata, but a manifest
# copy keeps trait filtering correct even if module introspection fails.
tool-metadata:
  - toolName: artifact_list
    namespace: artifacts
    access: read
  - toolName: artifact_read
    namespace: artifacts
    access: read
  - toolName: artifact_search
    namespace: artifacts
    access: read
  - toolName: namespace_list
    namespace: artifacts
    access: read
  - toolName: artifact_upload
    namespace: artifacts
    access: write
