name: system
description: Host system access — shell execution, opening files, and reporting Barry's own gaps

bags:
  - filesystem
  - locks

requires:
  sessions:
    reason: status reads session liveness and recent session activity

tools:
  entry: tools.ts
  # RESEND_API_KEY is deliberately NOT listed. `env:` means REQUIRED — `bag
  # doctor` reports anything here a barry has not bound — and only `support`
  # needs the key, to mail a report to whoever maintains this Barry. Listing it
  # flagged every install that had no reason to own a Resend account, on a
  # builtin nobody opted into. The tool declares it in its own `secrets:`
  # (src/tools.ts), which is what makes it resolve for a barry that binds one;
  # unbound, the handler throws a clear error rather than failing quietly.
  deferred:
    - status
