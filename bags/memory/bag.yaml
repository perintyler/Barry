name: memory
description: Repo- and tag-scoped memories — agents save them, sessions start with them

tools:
  entry: tools.ts
  # Curation and import are occasional; keep them behind tool_search so the
  # everyday surface is save/search/get — the loop an agent actually runs.
  deferred:
    - update
    - forget
    - list_tags
    - import_claude

services:
  web:
    description: Memory browser — search, edit, and curate memories in a web UI
    command: pnpm
    args: ["exec", "tsx", "server/src/index.ts"]
    working-directory: .
    port: 3867
    health: /health
    run-at-load: true
    keep-alive: true

