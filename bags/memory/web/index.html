<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Barry Memory</title>
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <header>
    <h1>Memory</h1>
    <span id="count" class="muted"></span>
    <div class="spacer"></div>
    <button id="new-btn">New memory</button>
  </header>

  <div class="filters">
    <input id="search" type="search" placeholder="Search memories… (full-text)" autocomplete="off">
    <select id="repo-filter">
      <option value="">All repos</option>
    </select>
    <select id="mode-filter">
      <option value="">Any mode</option>
      <option value="always">always</option>
      <option value="on-demand">on-demand</option>
    </select>
    <label class="check"><input id="archived-filter" type="checkbox"> archived</label>
  </div>
  <div id="tag-bar" class="tag-bar"></div>

  <main>
    <ul id="list" class="list"></ul>

    <section id="editor" class="editor hidden">
      <div class="editor-head">
        <h2 id="editor-title">Edit memory</h2>
        <button id="close-btn" class="ghost">✕</button>
      </div>
      <label>Title <input id="f-title"></label>
      <label>Body <textarea id="f-body" rows="14" spellcheck="false"></textarea></label>
      <div class="row">
        <label>Tags <input id="f-tags" placeholder="comma, separated"></label>
        <label>Mode
          <select id="f-mode">
            <option value="on-demand">on-demand</option>
            <option value="always">always</option>
          </select>
        </label>
      </div>
      <div class="row">
        <label class="grow">Repo <input id="f-repo" placeholder="github.com/owner/name"></label>
        <label class="check">global <input id="f-global" type="checkbox"></label>
      </div>
      <div class="row meta muted" id="f-meta"></div>
      <div class="row actions">
        <button id="save-btn" class="primary">Save</button>
        <button id="archive-btn" class="danger">Archive</button>
        <button id="restore-btn" class="hidden">Restore</button>
      </div>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
