name: session
description: Barry session lifecycle — inspect, create and update coding sessions

# Session lifecycle recording. These are how every session's rows get into the
# sessions/messages tables — the mode travels in args (argv), never inferred
# from the provider's hook_event_name (see session-tracker/normalize.ts for the
# outage that rule encodes).
hooks:
  - event: session-start
    run: hooks/session-tracker/index.ts
    args: [start]
  - event: session-end
    run: hooks/session-tracker/index.ts
    args: [end]
  - event: stop
    run: hooks/session-tracker/index.ts
    args: [assistant-message]
  - event: user-prompt
    run: hooks/session-tracker/index.ts
    args: [user-message]
  - event: post-tool
    run: hooks/change-tracker/index.ts
    # Cursor needs afterFileEdit as well as postToolUse, matching the old
    # hardcoded registration in cli/src/lib/cursor-hooks.ts.
    cursor-events: [postToolUse, afterFileEdit]

services:
  store:
    description: Session store service — leased, batched writes to session storage
    command: pnpm
    args: ["exec", "tsx", "server/src/index.ts"]
    working-directory: .
    port: 3865
    health: /health
    run-at-load: true
    keep-alive: true
    # Map form so BARRY_DATABASE_URL is REQUIRED: @barry/db silently defaults
    # to barry_dev on 5432 when it is unset, so a service missing it starts
    # healthy, answers /health, and writes to the wrong database — which is
    # exactly what happened on the first install (FK violations against a
    # sessions table that lives in the other cluster).
    env:
      BARRY_DATABASE_URL:
        source: .env
        required: true
      BARRY_SECRET:
        source: .env
        required: false
      BARRY_ENV:
        source: .env
        required: false
      NODE_ENV:
        source: .env
        required: false

tools:
  entry: tools.ts
  # Session lookup is a large surface that most sessions never touch. Keep it
  # out of every tool list and let tool_search surface it on demand.
  deferred:
    - status
    - list_sessions
    - get_session
    - get_active_sessions
    - get_recent_sessions_for_directory
    - search_sessions
    - list_directories
    - get_most_recent_session
    - get_session_detail
    - get_session_context
    - find_session_by_github_pr
    - find_session_by_linear_issue
    - create_session
    - create_draft_session
    - create_session_from_linear
    - create_session_from_github_pr
    - list_planned_sessions
    - update_session_metadata
    - set_current_session_name
    - update_session
    - check_prompts
    - get_session_info
    - get_session_progress
