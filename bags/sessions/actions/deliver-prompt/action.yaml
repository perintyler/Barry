name: deliver-prompt
description: >-
  Deliver a scheduled prompt into a session. Run by the one-off schedule that
  schedule_prompt creates — use schedule_prompt rather than calling this.
context: none
run: deliver-prompt.ts
input_schema:
  type: object
  properties:
    sessionId: { type: string }
    prompt: { type: string }
    scheduledAt: { type: string }
  required: [sessionId, prompt]
secrets:
  # The session message route and the events route are authenticated.
  - BARRY_SECRET
timeout: 2m
