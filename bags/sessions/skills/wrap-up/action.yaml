version: 1
name: wrap-up
description: Summarize session work and identify open loops
slash_command: true
# No `context:` — wrap-up summarizes THIS conversation, so it needs the
# calling session and can only run inline (the default).
output_schema:
  type: string
  description: >-
    The full wrap-up report as markdown, with the Done / Open Loops /
    Suggested Next Steps sections the prompt specifies. This is the
    deliverable itself — complete_action's summary stays one line.
prompt: |-
  # Wrap Up

  Summarize what was accomplished this session and identify any loose ends.

  ## Output

  ### Done
  - Bullet list of completed work

  ### Open Loops
  Each open loop should be numbered and include a unique ID for easy reference. Use format `OL-XXXXXX` where XXXXXX is the first 6 characters of a UUID (e.g., `OL-a3f2c1`).

  1. **OL-a3f2c1** - Description of the open loop
  2. **OL-7b9e4d** - Another open loop

  Categories to check:
  - Anything started but not finished
  - Decisions deferred
  - TODOs mentioned but not addressed
  - Tests not run, docs not updated, etc.

  ### Suggested Next Steps
  - What to pick up next session (if any)

  ## Recording this

  The report above IS the deliverable — pass it to `complete_action`, writing it
  to a file and using `output_file` rather than inlining pages of markdown.

  Then keep your reply SHORT. The report is recorded and retrievable
  (`barry action show <run_id>`), so restating it is noise: give a one-line
  confirmation plus only what genuinely needs the user's attention — decisions
  they must make, things you could not do, surprises worth knowing. If nothing
  does, say so in a sentence.
