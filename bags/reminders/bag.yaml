name: reminders
description: One-time reminders delivered via barry notify

cli:
  alias: remind

tools:
  entry: tools.ts
  env:
    - BARRY_REMINDER_CHANNEL
  # Granted to every session (reminders is in DEFAULT_TRAITS) but kept out of
  # tools/list — see the same note in bags/keychain/bag.yaml. `add`/`list`/
  # `cancel` are generic enough that always-visible entries invite misfires;
  # a session that wants a reminder finds them via `tool_search`.
  deferred:
    - add
    - list
    - cancel

jobs:
  dispatch:
    description: "Deliver reminders whose due time has passed"
    command: tsx
    args:
      - src/dispatch.ts
    # Every 15 minutes. launchd has no true one-shot trigger, so reminders are
    # data in ~/.barry/reminders.json and this job is what makes them fire.
    # A reminder due while the machine is asleep is delivered on wake.
    interval: 900
    env:
      - BARRY_REMINDER_RETAIN_DAYS
