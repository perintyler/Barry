version: v0.1
name: instructions
description: Reference instructions — search what standing guidance exists and read it in full

# Note: this bag OWNS the instruction tools. It is not the place bags put their
# own instructions/ prose — every bag ships that in its own directory, and this
# bag's tools read across all of them.
tools:
  entry: tools.ts
  # Granted to every session (instructions is in DEFAULT_TRAITS) but kept out of
  # tools/list — see the same note in bags/keychain/bag.yaml. Standing guidance
  # is looked up when a task calls for it, not on every turn, so the pair lives
  # behind `tool_search`.
  deferred:
    - search_instructions
    - get_instructions

tool-metadata:
  - { toolName: search_instructions, namespace: instructions, access: read }
  - { toolName: get_instructions, namespace: instructions, access: read }
