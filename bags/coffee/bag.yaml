name: coffee
description: Keep this Mac awake — a supervised caffeinate that releases on battery

dependencies:
  - name: caffeinate
    reason: creates the IOKit power assertions that keep the display and system awake
  - name: pmset
    reason: reads the power source, and reverts disablesleep when lid-awake is enabled

tools:
  entry: tools.ts

services:
  # The daemon is deliberately NOT run-at-load. Whether coffee starts with the
  # machine is a runtime setting (`autostart` in ~/.barry/coffee.json), not a
  # property baked into the plist — flipping it must not require regenerating
  # launchd state, because `scripts/launchd/setup` prunes every bag agent it
  # does not re-declare and is far too blunt an instrument for a toggle.
  #
  # `run-at-load: false` renders as an omitted RunAtLoad key, so launchd will
  # not start this at login. The supervisor re-reads config every poll, so
  # `barry coffee on` takes effect without touching launchd at all.
  #
  # The shell scripts live in `scripts/`, not the conventional `bin/`: the repo
  # .gitignore has a global `bin/` rule (build output), which silently left both
  # of these untracked — a bag whose daemon does not exist on a fresh clone.
  daemon:
    description: Holds a caffeinate assertion while enabled and running on AC power
    command: /bin/bash
    args: ["scripts/coffee-supervisor"]
    working-directory: .
    run-at-load: false
    keep-alive: true

  # Runs once at login and exits. Covers the one case the supervisor's EXIT
  # trap cannot: a kill -9 or power loss that leaves `pmset disablesleep 1`
  # set system-wide. Without this, a dirty death means the Mac silently cannot
  # sleep until somebody notices and reverts it by hand.
  reconcile:
    description: Clears an orphaned disablesleep left behind by a dirty shutdown
    command: /bin/bash
    args: ["scripts/coffee-reconcile"]
    working-directory: .
    run-at-load: true
    keep-alive: false
