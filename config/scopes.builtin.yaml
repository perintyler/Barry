# Builtin scopes — ship with Barry and seed the scopes table.
# Do not edit for machine-local changes: override in config/scopes.local.yaml (gitignored).
# Scopes RESTRICT capabilities (deny tools, write access, file patterns, bash commands).
# They can only take away what traits granted.

- name: readonly
  description: "Read-only: no file writes, no bash, no outbound write requests"
  scope:
    deniedTools: [Bash, Write, Edit]
    deniedAccess: [write]
    network:
      actions: [write]

# Denies BOTH the MCP Bash and the provider's native Bash — naming a
# natively-backed tool in deniedTools drives scopeNeedsNativeToolDenial, which
# adds `Bash(*)` to the session's permission deny-list. Denying only the MCP
# copy is what made this scope inert before.
- name: no-bash
  description: No bash or shell execution
  scope:
    deniedTools: [Bash]

- name: no-secrets
  description: Filesystem access blocked for common secrets and credential files
  scope:
    files:
      deny: ["*.env", ".env.*", ".ssh/**", "*.pem", "*.key", "*.p12", "*.pfx"]

- name: no-network
  description: All outbound network access denied
  scope:
    network:
      actions: [all]

- name: no-network-write
  description: No outbound network writes — reads allowed
  scope:
    network:
      actions: [write]

# Enforced by the egress sandbox, not just the app-level guards: outbound
# traffic is proxied and filtered by hostname, and the agent cannot lift it.
# An empty allowDomains means nothing but localhost is reachable.
- name: sandboxed-offline
  description: "Sandboxed: no outbound network at all (proxy-enforced, agent cannot bypass)"
  scope:
    network:
      actions: [all]
      enforce: sandbox
      allowDomains: []

# Pairs with the slack bag's `slack-me` trait, which grants the `slack`
# namespace at readwrite so `send_slack_message_to_self` — the one write tool
# with no destination parameter — survives. Everything else that can pick a
# recipient is named here.
#
# Denied by NAME, not by `deniedAccess: [write]`: that blunter form would take
# the self-DM tool with it, leaving the trait read-only and pointless.
#
# The list is exhaustive over the slack namespace's write tools as of writing,
# and `slack-me-tools.test.ts` in the bag fails when a new one appears — an
# allow-list cannot be expressed here, so a new write tool would otherwise be
# granted silently the moment it is added.
- name: slack-self-dm-only
  description: "Slack: only the self-DM write tool — no tool that can pick a recipient"
  scope:
    deniedTools:
      - send_slack_message
      - send_message_as_user
      - pretty_slacker
