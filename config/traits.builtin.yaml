# Builtin traits — ship with Barry and seed the traits table.
# Do not edit for machine-local changes: override in config/traits.local.yaml (gitignored).
# Traits GRANT capabilities (bags/tools + access level). Restrictions live in scopes.

# Default traits — applied to every session (see DEFAULT_TRAITS in session-scope.ts).
- name: coding
  description: "Code and shell: filesystem, git tools, and Bash. Raw git is blocked (use git_* tools); publishing gh commands are blocked."
  access: readwrite
  bags: [system, filesystem, git]
  # All git usage must go through the structured git_* tools, never raw shell —
  # this keeps an agent from accidentally committing or pushing via bash. For gh
  # we deny only the publishing/mutating subcommands (opening PRs, merging,
  # creating issues/releases/repos); read-only gh (pr view, api GET, run view)
  # stays available since it has no structured-tool equivalent yet.
  scope:
    bash:
      denyPrograms:
        - git            # all git — use the git_* tools
        - gh:pr:create   # opening PRs is the main accident to prevent
        - gh:pr:merge
        - gh:pr:close
        - gh:pr:ready
        - gh:pr:edit
        - gh:issue:create
        - gh:issue:close
        - gh:issue:edit
        - gh:release:create
        - gh:repo:create
        - gh:repo:delete
        - gh:api:write   # gh api with -X POST/PATCH/PUT/DELETE or -f/-F fields

- name: sessions
  description: "Barry session context: session state, change tracking, and events"
  access: readwrite
  bags: [session, changes, events, actions]

# `media` and `md_to_pdf` come from bags outside this repo. A bag declaring
# a namespace auto-generates its own trait, so personal media tooling is reached
# through that trait (or one defined in the config repo) rather than from here.
- name: artifacts
  description: "Artifacts: publish and update hosted pages"
  access: readwrite
  bags: [artifacts]

- name: figma
  description: "Figma design tools: read design context, variables, metadata, and screenshots"
  bags: [figma]
  scopes: [readonly]

# `read` and `all` cover what ships in this repo: the eleven local bags plus
# the remote bags declared in config/bags.builtin.yaml. They deliberately
# do not name namespaces from personal bags — those drift out of existence
# silently, and every bag already auto-generates a `{name}` trait.
- name: read
  description: All Barry tools with read-only access
  bags: [actions, artifacts, bdiff, changes, events, figma, filesystem, git, keychain, locks, notion, reminders, session, system, vault]
  scopes: [readonly]

- name: all
  description: "All Barry tools: every namespace enabled with full read/write access"
  access: readwrite
  bags: [actions, artifacts, bdiff, changes, events, figma, filesystem, git, keychain, locks, notion, reminders, session, system, vault]
