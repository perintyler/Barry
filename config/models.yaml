# Model registry — providers and their curated model lists.
#
# Authoritative: seeded into the providers/models tables on every boot,
# idempotently. Editing this file and re-seeding IS the way to change the
# catalog — the DB is a cache, not a second source of truth.
#
# `models` here is the CURATED PICKER LIST, not an exhaustive mirror of
# what each provider offers (cursor alone exposes ~120 ids because it bakes
# reasoning effort into them). Unknown model ids still work everywhere:
# validation warns, never blocks, and the messages FK upserts on write.
#
# `default: null` means pass no model flag and let the provider CLI decide.

