  # Local models served by an Ollama daemon.
  #
  # Unlike every other provider, this list is a HINT, not the catalog. The real
  # one is whatever the daemon has pulled, and `GET /models` merges /api/tags
  # over these entries when it is reachable. They exist so the picker is not
  # empty when the daemon is down and so model validation has something to
  # suggest against.
  #
  # `default` is set rather than null: null means "let the provider CLI decide",
  # and there is no Ollama CLI default to fall back to (same as zai).
  #
  # The `note` fields are load-bearing. Measured 2026-09-11 on Ollama 0.33.3,
  # 16GB machine: under Barry's full system prompt these models answer in prose
  # instead of calling tools — a session "succeeds" having done nothing. The
  # picker is where someone chooses, so the caveat belongs here.
  - key: ollama
    label: Ollama (local)
    default: qwen3:4b
    models:
      # role: small is measured, not guessed — bookkeeping-model.ts compared 4b
      # against 8b on real session transcripts: identical drift accuracy, ~3x
      # faster (~4s vs ~13s), 4.1GB vs 6.6GB resident.
      - id: qwen3:4b
        label: Qwen3 4B
        note: "Proven for auxiliary inference; unreliable at tool calling in full sessions."
        metadata: { role: small }
      - id: qwen3:8b
        label: Qwen3 8B
        note: "Slower with no measured accuracy gain; exceeded 2min on a trivial coding turn."
      - id: llama3.2:3b
        label: Llama 3.2 3B
        note: "Too small for agentic sessions."
      - id: llama3.2:1b
        label: Llama 3.2 1B
        note: "Too small for agentic sessions."
