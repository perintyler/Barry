# Services Registry
# Configuration for launchd-managed servers and applications
# Services can be enabled/disabled without removing templates
#
# Ports are owned by .env.prod — not defined here.
# Each service env list references vars from the deploy's .env.prod file;
# setup-launchd resolves them at install time.
# Hardcoded values use "KEY=value" syntax.

services:
  # Core Barry Services (always enabled)
  web:
    path: apps/web/barry.works
    description: "Main Barry web interface"
    enabled: true
    env:
      - BARRY_SECRET
      - BARRY_DATABASE_URL
      - AXIOM_TOKEN
      - SENTRY_WEB_DSN

  api:
    path: servers/api
    description: "Main Barry API server"
    enabled: true
    # BARRY_NAMESPACE_SPLIT builds one MCP server entry per pack namespace, so
    # tools reach the agent as mcp__git__status rather than one flat
    # mcp__barry__*. (Keep comments out of the `env:` list itself — the parser
    # treats any non `- ` line at that indent as the end of the list.)
    env:
      - BARRY_DATABASE_URL
      - AXIOM_TOKEN
      - BARRY_TRUST_PROXY=true
      - SENTRY_DSN
      - MAILGUN_SIGNING_KEY
      - MAILGUN_MAX_AGE_SECONDS
      - BARRY_NAMESPACE_SPLIT

  # HTTP Servers
  whisperflow:
    path: servers/whisperflow
    description: "Audio processing service"
    enabled: true
    env:
      - DEEPGRAM_API_KEY
      - AXIOM_TOKEN
      - SENTRY_DSN

  # Named bdiff-review (not bdiff): com.barry.bdiff is already the
  # launchd label for the BDiff macOS app itself.
  bdiff-review:
    path: servers/bdiff
    description: "BDiff code-review comments service"
    enabled: true
    env: []

  slack:
    path: servers/slack
    description: "Slack App — slash commands and event webhooks"
    enabled: true
    env:
      - SLACK_SIGNING_SECRET
      - SLACK_BOT_TOKEN
      - SLACK_USER_TOKEN

  # Applications
  github-app:
    path: servers/github
    description: "GitHub App webhook receiver"
    enabled: true
    env:
      - BARRY_SECRET
      - AXIOM_TOKEN
      - SENTRY_DSN
      - GITHUB_WEBHOOK_SECRET
      - GITHUB_APP_ID
      - GITHUB_CLIENT_ID
      - GITHUB_CLIENT_SECRET
      - GITHUB_INSTALLATION_ID
      - GITHUB_PRIVATE_KEY_PATH=$HOME/.barry/secrets/github-app-private-key.pem
