# Services Registry
# Configuration for launchd-managed servers and applications
# Services can be enabled/disabled without removing templates
#
# Ports are owned by the PORTS registry in packages/env/src/index.ts (servers
# bind via getServicePort(), which applies the dev/prod offset) — not defined
# here and not controlled by .env. BARRY_*_PORT vars in .env exist only so
# launchd templates can inject them for consumers that display or proxy ports.
# Each service env list references vars from the deploy's .env file;
# setup-launchd resolves them at install time.
# Hardcoded values use "KEY=value" syntax.

services:
  # Core Barry Services (always enabled)
  #
  # Not listed: web. barry.works is a bag now (~/repos/bags/barry.works) and
  # declares its own service, so it is installed as
  # com.barry.bag.barry.works.web rather than com.barry.web. Its port lives in
  # that bag's manifest; see the note above about where ports are owned.
  api:
    path: servers/api
    entry: src/index.ts
    description: "Main Barry API server"
    enabled: true
    # BARRY_NAMESPACE_SPLIT builds one MCP server entry per bag namespace, so
    # tools reach the agent as mcp__git__status rather than one flat
    # mcp__barry__*. (Keep comments out of the `env:` list itself — the parser
    # treats any non `- ` line at that indent as the end of the list.)
    env:
      - BARRY_DATABASE_URL
      - SESSION_STORE_TRANSPORT
      - BARRY_TRUST_PROXY=false
      - SENTRY_DSN
      - MAILGUN_SIGNING_KEY
      - MAILGUN_MAX_AGE_SECONDS
      - BARRY_NAMESPACE_SPLIT

  # HTTP Servers
