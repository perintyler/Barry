# Slack identity configuration
#
# Read from ANOTHER REPO: ~/repos/bags/slack, by the pretty-slacker tool's
# loadDefaultIdentity() (src/pretty-slacker/slack-config.ts), which walks up
# from its own location — or BARRY_REPO — looking for this path. Nothing in
# this repo reads it, so a grep confined to ~/repos/barry finds no consumer and
# the file looks dead. It is not. Deleting it does not fail loudly either: the
# read is wrapped in try/catch and falls back to "user", so the only symptom of
# removing it is that `default:` below silently stops working.

# Default identity to use when none is specified
default: user

# Available identities
identities:
  user:
    description: "Tyler's Slack account (sends as you)"
    token_env: SLACK_USER_TOKEN
  bot:
    description: "Barry bot account"
    token_env: SLACK_BOT_TOKEN
