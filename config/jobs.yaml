# Jobs Registry
# Recurring tasks managed by launchd (cron-like).
# Each job maps to a script in scripts/jobs/<name>.
# The setup script generates plists from this file.
#
# interval: seconds between runs (launchd StartInterval)
# schedule: calendar-based (launchd StartCalendarInterval)
#   hour: 0-23
#   minute: 0-59
# env: vars resolved from .env at plist install time

jobs:
  health-check:
    description: "Monitor critical services and alert when down"
    enabled: true
    interval: 300
    env:
      # SLACK_BOT_TOKEN is read directly by lib.sh's fallback curl path.
      # SMS credentials are deliberately absent: notify resolves those from the
      # profile/vault, so a copy here would never be read.
      - SLACK_BOT_TOKEN
      - BARRY_API_PORT
      - BARRY_MCP_BARRY_PORT

  log-maintenance:
    description: "Truncate service logs exceeding 10MB"
    enabled: true
    interval: 86400

  backup:
    description: "Nightly barry db backup (Postgres, file-tracker, vault)"
    enabled: true
    schedule:
      hour: 3
      minute: 30
    env:
      # Without a recipient the vault snapshot is written unencrypted. It is
      # already ciphertext (the vault is zero-knowledge), but these backups are
      # meant to be copyable off the machine.
      - BARRY_VAULT_AGE_RECIPIENT
      - BARRY_DATABASE_URL
      - SLACK_BOT_TOKEN
      # R2 off-machine upload. Absent these the job runs and reports
      # "r2: not configured" rather than failing. These are R2 *S3 API* tokens,
      # not the Cloudflare API token Terraform uses.
      - BARRY_R2_ACCESS_KEY_ID
      - BARRY_R2_SECRET_ACCESS_KEY
      - BARRY_R2_ACCOUNT_ID

