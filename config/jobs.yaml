# Jobs Registry
# Recurring tasks managed by launchd (cron-like).
# Each job maps to a script in scripts/jobs/<name>.
# The setup script generates plists from this file.
#
# interval: seconds between runs (launchd StartInterval)
# schedule: calendar-based (launchd StartCalendarInterval)
#   hour: 0-23
#   minute: 0-59
#   weekday: 0-7 (0 and 7 both mean Sunday)
# env: vars resolved from .env at plist install time

jobs:
  health-check:
    description: "Monitor critical services and alert when down"
    enabled: true
    interval: 300
    env:
      # SLACK_BOT_TOKEN is read directly by lib.sh's fallback curl path.
      # SMS credentials are deliberately absent: notify resolves those from the
      # profile/vault, so a copy here would never be read.
      - SLACK_BOT_TOKEN
      - BARRY_API_PORT
      - BARRY_MCP_BARRY_PORT

  log-maintenance:
    description: "Truncate service logs exceeding 10MB"
    enabled: true
    # Calendar rather than a fixed period: launchd counts a period from load and
    # resets it on every reload, so a 24h job on a machine that sleeps and
    # reloads can go indefinitely without firing — this one had 0 runs in 7 days.
    # A missed calendar time is caught up on wake; a missed period is not.
    # 02:30 keeps it clear of the 03:30 backup and 04:30 disk-retention.
    schedule:
      hour: 2
      minute: 30

  read-tracking-report:
    description: "Weekly read-before-edit enforcement report (read_tracking.blocked)"
    enabled: true
    # Weekly is enough: the point is a falsifiable signal that hard
    # enforcement is not churning sessions — and that the job itself runs
    # (it reports zero rather than staying silent).
    schedule:
      hour: 9
      minute: 23
      weekday: 1
    env:
      - SLACK_BOT_TOKEN

  disk-retention:
    description: "Prune old deploys and dead session worktrees"
    enabled: true
    # Daily, offset from the 03:30 backup so two disk-heavy jobs do not overlap.
    # Retention was previously a side effect of `barry promote`, so it only ran
    # when someone deployed — deploys sat at 12GB for months and worktrees, which
    # had no pruning at all, reached 9.3GB against a 10GB alert.
    schedule:
      hour: 4
      minute: 30
    env:
      # Session liveness is read from the database: /sessions/:id is
      # authenticated, so a curl check fails for every session and would make
      # the job silently keep everything.
      - BARRY_DATABASE_URL
      - SLACK_BOT_TOKEN

  backup:
    description: "Nightly barry db backup (Postgres, file-tracker, vault)"
    enabled: true
    schedule:
      hour: 3
      minute: 30
    env:
      # Without a recipient the vault snapshot is written unencrypted. It is
      # already ciphertext (the vault is zero-knowledge), but these backups are
      # meant to be copyable off the machine.
      - BARRY_VAULT_AGE_RECIPIENT
      - BARRY_DATABASE_URL
      - SLACK_BOT_TOKEN
      # R2 off-machine upload. Absent these the job runs and reports
      # "r2: not configured" rather than failing. These are R2 *S3 API* tokens,
      # not the Cloudflare API token Terraform uses.
      - BARRY_R2_ACCESS_KEY_ID
      - BARRY_R2_SECRET_ACCESS_KEY
      - BARRY_R2_ACCOUNT_ID

