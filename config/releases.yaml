# What ships to the public GitHub mirror.
# Every workspace package is public; these lists cover the repo *root*, where
# most entries are local state that must not ship. Anything at root not named
# here is deleted from the published copy.
# `staging.files` ship only to the staging mirror, never to prod.

public:
  directories:
    - assets
    - builtins
    - docs
    - config
    - hooks/npm-to-pnpm
    - hooks/rm-to-trash
    - infra
    - scripts
    - packs
    - apps/macos

  files:
    - README.md
    - RELEASES.md
    - LICENSE.md
    - install.sh
    - pnpm-workspace.yaml
    - package.json
    - tsconfig.projects.json
    - tsconfig.base.json
    - tsconfig.eslint.json
    - vitest.base.config.ts
    - eslint.config.js
    - knip.json
    - .gitignore
    - .npmrc
    - .node-version
    - .swiftlint.yml
    - .qaignore
    - .github/actions/setup/action.yml
    - .github/workflows/lint.yml
    - .github/workflows/verify.yml
    - .github/workflows/_postgres-tests.yml
    - .github/workflows/test-packages.yml
    - .github/workflows/test-cli.yml
    - .github/workflows/test-packs.yml
    - .github/workflows/test-servers.yml
    - .github/workflows/test-web.yml
    - .github/workflows/test-macos.yml

# npm packages that must be published before a prod release can sync.
# `barry release sync prod` checks the registry and blocks if any version
# listed here hasn't been published yet. Staging syncs skip this check.
publish:
  npm:
    - packages/packs-sdk

staging:
  files: []

# Applied on every sync (staging and prod alike) after filtering: `from` is
# copied over `to` in the published tree, for content that must differ between
# this repo and the mirror. Empty since the CI workflows became shared — the
# same per-area workflows now run in both places.
sync:
  overlays: []
