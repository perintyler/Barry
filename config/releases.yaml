# What ships to the public GitHub mirror.
# Everything NOT listed here is private and gets stripped or stubbed.
# Workspace paths match keys in config/workspace-entries.json.
# `staging.files` ship only to the staging mirror, never to prod.

public:
  workspace:
    # packages
    - packages/agent-scope
    - packages/agent-runtime
    - packages/auth
    - packages/contracts
    - packages/db
    - packages/email
    - packages/env
    - packages/file-tracker
    - packages/github
    - packages/logger
    - packages/md-to-ansi
    - packages/packs
    - packages/qa-guidelines
    - packages/secrets
    - packages/sentry
    - packages/sessions
    - packages/stop-robots
    - packages/slack
    - packages/spunk
    - packages/syntax
    - packages/themes
    - packages/tools
    - packages/ui
    - packages/vault

    # packs
    - packs/bdiff
    - packs/core
    - packs/filesystem
    - packs/git
    - packs/keychain
    - packs/locks
    - packs/markdown

    # sdks
    - sdks/artifacts
    - sdks/links
    - sdks/notes

    # apps
    - apps/web/red-marker
    - servers/github
    - cli

    # servers
    - servers/api
    - servers/bdiff
    - servers/whisperflow
    - servers/mcp

    # hooks
    - hooks/change-tracker
    - hooks/session-tracker

  directories:
    - assets
    - docs
    - config
    - hooks/npm-to-pnpm
    - hooks/rm-to-trash
    - infra
    - scripts
    - packs
    - apps/macos

  files:
    - README.md
    - LICENSE.md
    - install.sh
    - pnpm-workspace.yaml
    - package.json
    - tsconfig.projects.json
    - tsconfig.base.json
    - tsconfig.eslint.json
    - vitest.base.config.ts
    - eslint.config.js
    - knip.json
    - .gitignore
    - .npmrc
    - .node-version
    - .swiftlint.yml
    - .qaignore
    - .github/actions/setup/action.yml

staging:
  files: []

# Applied on every sync (staging and prod alike) after filtering: `from` (a path
# in the private repo, shipped inside a public directory) is copied over `to` in
# the published tree. This is how the published copy gets its own CI workflow —
# the private .github/workflows/ci.yml exercises private apps and never ships.
sync:
  overlays:
    - from: config/release/workflows/ci.yml
      to: .github/workflows/ci.yml
