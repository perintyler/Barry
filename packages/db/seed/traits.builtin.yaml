# Builtin traits — ship with Barry and seed the traits table.
# Do not edit for machine-local changes: override in config/traits.local.yaml (gitignored).
# Traits GRANT capabilities (bags/tools + access level). Restrictions live in bounds.

# Default traits — applied to every session (see DEFAULT_TRAITS in session-scope.ts).
#
# The `gh` publishing deny-list that used to live here, and the `checks`
# instructions pointer with it, moved to the `IC` trait in the coding bag
# (bags/coding/bag.yaml, as an inline `bound:`). Which subcommands are worth
# denying is a house style, and this file applies to EVERY identity — including
# ones nobody here will ever configure — so the opinion belongs somewhere it can
# be opted into rather than inherited.
#
# The bare `git` denial stayed. The line it draws is not style: raw git in bash
# is how an agent commits or pushes BY ACCIDENT, and the structured git_* tools
# cover the same ground deliberately. A framework default that leaves that open
# fails open on the one mistake that reaches other people's repositories.
#
# `bags:` is load-bearing and must stay: `system` is in ALWAYS_ON_BAGS, and this
# is the only default trait granting the system/filesystem/git namespaces.
# servers/mcp/src/session-bound.test.ts reads this file and enforces that.
- name: coding
  description: "Code and shell: filesystem, git tools, and Bash. Raw git is blocked (use git_* tools); the coding bag's IC trait adds the gh publishing denials."
  access: readwrite
  bags: [system, filesystem, git]
  bound:
    bash:
      denyPrograms:
        - git            # all git — use the git_* tools

- name: sessions
  description: "Barry session context: session state, change tracking, and events"
  access: readwrite
  # `session` (singular) is what the 27 tools in bags/sessions actually stamp;
  # `sessions` (plural) is the bag name that the auto-traits fallback invented
  # before the bag declared `tool-metadata:`. Both are listed for one release:
  # traits are additive, so keeping the stale name cannot remove anything from a
  # live session mid-flight, while adding the real one is what finally grants
  # these tools by trait rather than only via ALWAYS_ON_SERVERS. Drop `sessions`
  # once no trait row in any database still references it.
  bags: [session, sessions, changes, events, actions, instructions]

# `media` and `md_to_pdf` come from bags outside this repo. A bag declaring
# a namespace auto-generates its own trait, so personal media tooling is reached
# through that trait (or one defined in the config repo) rather than from here.
- name: artifacts
  description: "Artifacts: publish and update hosted pages"
  access: readwrite
  bags: [artifacts]

- name: figma
  description: "Figma design tools: read design context, variables, metadata, and screenshots"
  bags: [figma]
  scopes: [readonly]

# `read` and `all` cover what ships in this repo: the eleven local bags plus
# the remote bags declared in bags.builtin.yaml. They deliberately
# do not name namespaces from personal bags — those drift out of existence
# silently, and every bag already auto-generates a `{name}` trait.
- name: read
  description: All Barry tools with read-only access
  bags: [actions, artifacts, changes, events, figma, filesystem, git, instructions, locks, notion, reminders, session, sessions, system, vault]
  scopes: [readonly]

- name: all
  description: "All Barry tools: every namespace enabled with full read/write access"
  access: readwrite
  bags: [actions, artifacts, changes, events, figma, filesystem, git, instructions, locks, notion, reminders, session, sessions, system, vault]
