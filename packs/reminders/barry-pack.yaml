manifestVersion: 1
name: reminders
description: One-time reminders delivered via barry notify

cli:
  alias: remind

instructions: |
  When the user asks to be reminded of something later — a deadline, a thing to
  check after a delay, a follow-up — use the `reminders_add` tool rather than
  telling them to remember it. Accepts absolute dates (2026-08-14) or offsets
  (30m, 6h, 14d, 2w).

tools:
  entry: tools.ts
  env:
    - BARRY_REMINDER_CHANNEL

jobs:
  dispatch:
    description: "Deliver reminders whose due time has passed"
    command: tsx
    args:
      - src/dispatch.ts
    # Every 15 minutes. launchd has no true one-shot trigger, so reminders are
    # data in ~/.barry/reminders.json and this job is what makes them fire.
    # A reminder due while the machine is asleep is delivered on wake.
    interval: 900
    env:
      - BARRY_REMINDER_RETAIN_DAYS
