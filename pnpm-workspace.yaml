packages:
  - adapters/completions/*
  - adapters/decisions/*
  - adapters/embeddings/*
  - adapters/sessions/*
  - bags/*
  - bags/filesystem/*
  - bags/identities/*
  - bags/schedules/*
  - bags/sessions/*
  - bags/sessions/extensions/*
  - bags/telemetry/*
  - bags/workflows/*
  - cli
  - sdk
# Workspace paths enumerate ownership roots; pnpm reads dependency overrides here.
# One Node types version prevents incompatible Buffer signatures across packages.
overrides:
  "@hono/node-server": "2.1.0"
  hono: "4.13.5"
  postcss: "8.5.23"
  sharp: "0.35.4"
  smol-toml: "1.8.0"
  uuid: "11.1.1"
  "@opentelemetry/core": "2.8.0"
  "ajv@8.17.1": "8.18.0"
  axios: "1.18.0"
  basic-ftp: "5.3.1"
  "brace-expansion@1": "1.1.21"
  "brace-expansion@2": "2.1.7"
  "brace-expansion@3": "3.0.9"
  "brace-expansion@4": "5.0.12"
  "brace-expansion@5": "5.0.12"
  esbuild: "0.28.1"
  fast-uri: "4.1.5"
  flatted: "3.4.2"
  follow-redirects: "1.16.0"
  form-data: "4.0.6"
  ip-address: "10.7.1"
  # 4.3.2, not 5.x: the advisories are fixed in 4.3.2, and js-yaml 5 dropped
  # the `types` export that @redocly/openapi-core (via openapi-typescript) needs.
  js-yaml: "4.3.2"
  linkify-it: "5.0.2"
  markdown-it: "14.2.0"
  nanoid: "6.0.1"
  qs: "6.16.0"
  undici: "8.10.0"
  ws: "8.21.0"
  typescript: "5.9.3"
  vitest: "4.1.11"
  yaml: "2.8.3"
  "@types/node": "22.15.0"
  # Every workspace pins @types/express 4, but @types/compression declares a
  # floating "*", which resolved to 5.x and put two structurally different
  # RequestHandler types in one program — `app.use(compression())` then failed
  # to typecheck against express 4's overloads. Same reasoning as @types/node
  # above: one version of a types package must win across the graph.
  "@types/express": "4.17.21"

allowBuilds:
  '@google/genai': false
  # better-sqlite3 has no prebuilt fallback: its install script downloads/compiles
  # better_sqlite3.node, and with it blocked every store open dies with
  # "Could not locate the bindings file".
  better-sqlite3: true
  esbuild: false
  protobufjs: false
