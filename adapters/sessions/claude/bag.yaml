name: claude
description: Native tool bounds for claude
credentials:
  ANTHROPIC_API_KEY: { source: vault, item: anthropic-api-key, field: password }
bounds:
  no-shell:
    description: Disable native shell
    tools:
      deny:
        - "claude-code:Bash"
        - "claude-code:PowerShell"
        - "claude-code:Monitor"
  no-file-reads:
    description: Disable native file-reads
    tools:
      deny:
        - "claude-code:Read"
        - "claude-code:Glob"
        - "claude-code:Grep"
  no-file-writes:
    description: Disable native file-writes
    tools:
      deny:
        - "claude-code:Write"
        - "claude-code:Edit"
        - "claude-code:NotebookEdit"
  no-network:
    description: Disable native network
    tools:
      deny:
        - "claude-code:WebFetch"
        - "claude-code:WebSearch"
