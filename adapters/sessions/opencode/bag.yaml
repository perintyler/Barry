name: opencode
description: Native tool bounds for opencode
credentials:
  ANTHROPIC_API_KEY: { source: vault, item: anthropic-api-key, field: password }
  OPENAI_API_KEY: { source: vault, item: openai-api-key, field: password }
  OPENROUTER_API_KEY: { source: vault, item: openrouter-api-key, field: password }
  Z_AI_API_KEY: { source: vault, item: z-ai-api-key, field: password }
bounds:
  no-shell:
    description: Disable native shell
    tools:
      deny:
        - "opencode:shell"
  no-file-reads:
    description: Disable native file-reads
    tools:
      deny:
        - "opencode:read"
        - "opencode:grep"
        - "opencode:glob"
  no-file-writes:
    description: Disable native file-writes
    tools:
      deny:
        - "opencode:edit"
        - "opencode:write"
        - "opencode:patch"
  no-network:
    description: Disable native network
    tools:
      deny:
        - "opencode:webfetch"
        - "opencode:websearch"
        - "opencode:execute"
