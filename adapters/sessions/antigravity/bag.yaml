name: antigravity
description: Native tools and traits for antigravity
credentials:
  GEMINI_API_KEY: { source: vault, item: gemini-api-key, field: password }
bounds:
  no-shell:
    description: Disable native shell
    bound:
      nativeTools:
        antigravity:
          - run_command
          - send_command_input
          - notebook_execution
          - command_status
  no-file-reads:
    description: Disable native file-reads
    bound:
      nativeTools:
        antigravity:
          - view_file
          - grep_search
          - find_by_name
          - list_dir
  no-file-writes:
    description: Disable native file-writes
    bound:
      nativeTools:
        antigravity:
          - write_to_file
          - replace_file_content
          - multi_replace_file_content
          - sed_file
          - notebook_edit
  no-network:
    description: Disable native network
    bound:
      nativeTools:
        antigravity:
          - read_url_content
          - search_web
  no-questions:
    description: Disable native questions
    bound:
      nativeTools:
        antigravity:
          - ask_question
          - ask_permission
          - ask_custom_permission
  no-tasks:
    description: Disable native tasks
    bound:
      nativeTools:
        antigravity:
          - manage_task
  no-agents:
    description: Disable native agents
    bound:
      nativeTools:
        antigravity:
          - invoke_subagent
          - define_subagent
          - manage_subagents
          - send_message
          - browser_subagent
  no-discovery:
    description: Disable native discovery
    bound:
      nativeTools:
        antigravity:
          - list_resources
          - read_resource
          - list_permissions
          - list_plugin_accounts
          - search_marketplace
  no-planning:
    description: Disable native planning
    bound:
      nativeTools:
        antigravity:
          - run_workflow
  no-schedules:
    description: Disable native schedules
    bound:
      nativeTools:
        antigravity:
          - schedule
  no-browser:
    description: Disable native browser
    bound:
      nativeTools:
        antigravity:
          - browser_click_element
          - browser_drag_pixel_to_pixel
          - browser_get_dom
          - browser_get_network_request
          - browser_input
          - browser_list_network_requests
          - browser_mouse_down
          - browser_mouse_up
          - browser_move_mouse
          - browser_press_key
          - browser_refresh_page
          - browser_resize_window
          - browser_scroll
          - browser_scroll_dom
          - browser_select_option
          - capture_browser_console_logs
          - capture_browser_screenshot
          - click_browser_pixel
          - execute_browser_javascript
          - list_browser_pages
          - open_browser_url
          - read_browser_page
  no-other:
    description: Disable native other
    bound:
      nativeTools:
        antigravity:
          - generate_image
          - delete_knowledge
          - wait
          - wait_5_seconds
          - finish
          - manage_inbox
traits:
  native-shell:
    description: Grant native shell
    access: readwrite
    nativeTools:
      antigravity:
        - run_command
        - send_command_input
        - command_status
  native-file-reads:
    description: Grant native file-reads
    access: read
    nativeTools:
      antigravity:
        - view_file
        - grep_search
        - find_by_name
        - list_dir
  native-file-writes:
    description: Grant native file-writes
    access: readwrite
    nativeTools:
      antigravity:
        - write_to_file
        - replace_file_content
        - multi_replace_file_content
        - sed_file
  native-network:
    description: Grant native network
    access: read
    nativeTools:
      antigravity:
        - read_url_content
        - search_web
