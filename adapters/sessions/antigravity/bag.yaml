name: antigravity
description: Native tool bounds for antigravity
credentials:
  GEMINI_API_KEY: { source: vault, item: gemini-api-key, field: password }
bounds:
  no-shell:
    description: Disable native shell
    tools:
      deny:
        - "antigravity:run_command"
        - "antigravity:send_command_input"
        - "antigravity:notebook_execution"
        - "antigravity:command_status"
  no-file-reads:
    description: Disable native file-reads
    tools:
      deny:
        - "antigravity:view_file"
        - "antigravity:grep_search"
        - "antigravity:find_by_name"
        - "antigravity:list_dir"
  no-file-writes:
    description: Disable native file-writes
    tools:
      deny:
        - "antigravity:write_to_file"
        - "antigravity:replace_file_content"
        - "antigravity:multi_replace_file_content"
        - "antigravity:sed_file"
        - "antigravity:notebook_edit"
  no-network:
    description: Disable native network
    tools:
      deny:
        - "antigravity:read_url_content"
        - "antigravity:search_web"
