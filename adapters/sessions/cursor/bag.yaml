name: cursor
description: Native tool bounds for cursor
credentials:
  CURSOR_API_KEY: { source: vault, item: cursor-api-key, field: password }
bounds:
  no-shell:
    description: Disable native shell
    tools:
      deny:
        - "cursor:Shell"
        - "cursor:WriteShellStdin"
  no-file-reads:
    description: Disable native file-reads
    tools:
      deny:
        - "cursor:Read"
        - "cursor:Glob"
        - "cursor:Grep"
        - "cursor:List"
        - "cursor:SemanticSearch"
  no-file-writes:
    description: Disable native file-writes
    tools:
      deny:
        - "cursor:Write"
        - "cursor:Edit"
        - "cursor:Delete"
  no-network:
    description: Disable native network
    tools:
      deny:
        - "cursor:WebFetch"
        - "cursor:WebSearch"
        - "cursor:Fetch"
