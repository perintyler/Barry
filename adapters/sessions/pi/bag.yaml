name: pi
description: Native tool bounds for pi
credentials:
  ANTHROPIC_API_KEY: { source: vault, item: anthropic-api-key, field: password }
bounds:
  no-shell:
    description: Disable native shell
    tools:
      deny:
        - "pi:bash"
        - "pi:powershell"
  no-file-reads:
    description: Disable native file-reads
    tools:
      deny:
        - "pi:read"
        - "pi:grep"
        - "pi:find"
        - "pi:ls"
  no-file-writes:
    description: Disable native file-writes
    tools:
      deny:
        - "pi:edit"
        - "pi:write"
  no-network:
    description: Disable native network
    tools:
      deny:
        - "pi:bash"
        - "pi:powershell"
