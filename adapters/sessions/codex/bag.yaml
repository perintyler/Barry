name: codex
description: Native tool bounds for codex
jobs:
  home-retention:
    description: Prune unpinned Codex conversations closed at least 30 days ago
    runs:
      using: node
      main: dist/retention.js
      secrets: [ BARRY_SECRET ]
    timeout: 5m
schedules:
  home-retention:
    every: 1d
    bags: [ bash, sessions ]
    job: home-retention
credentials:
  OPENAI_API_KEY: { source: vault, item: openai-api-key, field: password }
bounds:
  no-shell:
    description: Disable native shell
    tools:
      deny:
        - "codex:exec_command"
        - "codex:write_stdin"
  no-file-writes:
    description: Disable native file-writes
    tools:
      deny:
        - "codex:apply_patch"
  no-file-reads:
    description: Disable native file-reads
    tools:
      deny:
        - "codex:view_image"
  no-network:
    description: Disable native network
    tools:
      deny:
        - "codex:web_search"
        - "codex:web"
